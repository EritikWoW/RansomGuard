name: RansomGuard containment actuator VM qualification

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact source SHA to qualify.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ransomguard-containment-actuator-vm
  cancel-in-progress: false

jobs:
  actuator:
    environment: ransomguard-lab-vm
    runs-on: [self-hosted, Windows, X64, ransomguard-lab-vm]
    timeout-minutes: 30
    env:
      RANSOMGUARD_LAB_VM: I_UNDERSTAND
      RG_EXPECTED_SHA: ${{ inputs.expected_sha }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24 pinned
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1

      - name: Checkout orchestration policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24 pinned
        with:
          ref: main
          path: orchestrator
          fetch-depth: 1

      - name: Verify exact source and security gates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RG_EXPECTED_SHA -notmatch '^[0-9a-fA-F]{40}$'){
            throw 'expected_sha must be a full 40-character Git SHA.'
          }
          $actual=(git rev-parse HEAD).Trim()
          if(-not [string]::Equals($actual,$env:RG_EXPECTED_SHA,[StringComparison]::OrdinalIgnoreCase)){
            throw "Exact checkout mismatch. expected=$env:RG_EXPECTED_SHA actual=$actual"
          }

          Push-Location .\orchestrator
          try{
            .\tools\verify_powershell_automation.ps1
            .\tools\verify_supply_chain.ps1
            .\tools\verify_threat_model.ps1
          }finally{Pop-Location}

          .\tools\verify_powershell_automation.ps1
          .\tools\verify_supply_chain.ps1
          .\tools\verify_threat_model.ps1
          .\tools\verify_enforce_foundation.ps1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0 node24 pinned
        with:
          dotnet-version: 10.0.401

      - name: Restore and publish qualification executable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $project='.\qualification\RansomGuard.ContainmentActuatorQualification\RansomGuard.ContainmentActuatorQualification.csproj'
          dotnet restore $project --locked-mode -r win-x64
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

          $out=Join-Path $env:RUNNER_TEMP 'ransomguard-containment-actuator-bin'
          if(Test-Path -LiteralPath $out){Remove-Item -LiteralPath $out -Recurse -Force}
          dotnet publish $project -c Release -r win-x64 --self-contained true --no-restore -o $out
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

          $exe=Join-Path $out 'RansomGuard.ContainmentActuatorQualification.exe'
          if(-not(Test-Path -LiteralPath $exe -PathType Leaf)){throw "Qualification executable missing: $exe"}
          "RG_QUAL_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run disposable-VM containment actuator qualification
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $results=Join-Path $env:RUNNER_TEMP 'ransomguard-containment-actuator-results'
          if(Test-Path -LiteralPath $results){Remove-Item -LiteralPath $results -Recurse -Force}
          New-Item -ItemType Directory -Path $results -Force | Out-Null

          & $env:RG_QUAL_EXE --run $results $env:RG_EXPECTED_SHA
          if($LASTEXITCODE -ne 0){throw "Containment actuator qualification failed with exit $LASTEXITCODE."}

          $summaryPath=Join-Path $results 'containment-actuator-qualification.json'
          if(-not(Test-Path -LiteralPath $summaryPath -PathType Leaf)){throw 'Qualification summary was not produced.'}
          $summary=Get-Content -LiteralPath $summaryPath -Raw | ConvertFrom-Json
          if(-not [string]::Equals([string]$summary.expectedSha,$env:RG_EXPECTED_SHA,[StringComparison]::OrdinalIgnoreCase)){
            throw 'Qualification summary is not bound to the requested exact SHA.'
          }

          foreach($name in @(
            'successSuspended',
            'exactIdentityBound',
            'unrelatedUnaffected',
            'resumeRecovered',
            'replayRejected',
            'identityMismatchRejected',
            'hashDriftRejected',
            'expiryRejected',
            'degradedRejected',
            'maintenanceRejected',
            'failedRejected',
            'stoppedRejected',
            'telemetryRejected',
            'unknownCriticalRejected',
            'criticalRejected',
            'selfRejected',
            'protectedServiceRejected',
            'partialRecovered',
            'restartRecoveryRecovered',
            'timeoutRecovered',
            'cancellationRecovered',
            'stateChangeApiAvailable',
            'stateChangeExplicitResumeRecovered',
            'stateChangeCrashReleaseRecovered',
            'passed'
          )){
            if($summary.$name -ne $true){throw "Containment actuator invariant '$name' was not true."}
          }

      - name: Upload containment actuator qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 node24 pinned
        with:
          name: ransomguard-containment-actuator-${{ inputs.expected_sha }}
          path: ${{ runner.temp }}/ransomguard-containment-actuator-results/**
          if-no-files-found: warn
          retention-days: 30
