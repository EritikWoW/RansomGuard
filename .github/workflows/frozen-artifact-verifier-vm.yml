name: RansomGuard frozen immutable-package Driver Verifier

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Frozen-package Driver Verifier phase.
        required: true
        default: arm
        type: choice
        options:
          - arm
          - runtime
          - clear
      expected_sha:
        description: Exact frozen candidate source SHA.
        required: true
        type: string
      package_artifact_id:
        description: Artifact id of ransomguard-frozen-candidate-package-<expected_sha>.
        required: true
        type: string
      root_base:
        description: Persistent verifier campaign root.
        required: true
        default: C:\RansomGuard-VM-FrozenVerifier
        type: string
      stress_root_base:
        description: Disposable stress root.
        required: true
        default: C:\RansomGuard-VM-FrozenVerifier-Stress
        type: string
      parallelism:
        description: Stress admission width, 9-32.
        required: true
        default: '16'
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ransomguard-frozen-immutable-verifier-vm
  cancel-in-progress: false

jobs:
  verifier:
    environment: ransomguard-lab-vm
    runs-on: [self-hosted, Windows, X64, ransomguard-lab-vm]
    timeout-minutes: 60
    env:
      RANSOMGUARD_LAB_VM: I_UNDERSTAND
      RANSOMGUARD_LAB_CERT_THUMBPRINT: ${{ secrets.RANSOMGUARD_LAB_CERT_THUMBPRINT }}
      RG_VERIFIER_PHASE: ${{ inputs.phase }}
      RG_EXPECTED_SHA: ${{ inputs.expected_sha }}
      RG_WORKFLOW_SHA: ${{ inputs.expected_sha }}
      RG_FROZEN_PACKAGE_ARTIFACT_ID: ${{ inputs.package_artifact_id }}
      RG_VERIFIER_ROOT_BASE: ${{ inputs.root_base }}
      RG_VERIFIER_STRESS_ROOT_BASE: ${{ inputs.stress_root_base }}
      RG_VERIFIER_PARALLELISM: ${{ inputs.parallelism }}

    steps:
      - name: Checkout exact frozen candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24 pinned
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1

      - name: Checkout orchestration policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24 pinned
        with:
          ref: main
          path: orchestrator
          fetch-depth: 1

      - name: Verify orchestration and candidate policy
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location .\orchestrator
          try{
            .\tools\verify_powershell_automation.ps1
            .\tools\verify_supply_chain.ps1
            .\tools\verify_threat_model.ps1
          }finally{Pop-Location}

          .\tools\verify_powershell_automation.ps1
          .\tools\verify_supply_chain.ps1
          .\tools\verify_threat_model.ps1
          .\tools\verify_driver_verifier_vm_harness.ps1

      - name: Verify exact candidate and VM readiness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $actual=(git rev-parse HEAD).Trim()
          if(-not [string]::Equals($actual,$env:RG_EXPECTED_SHA,[StringComparison]::OrdinalIgnoreCase)){
            throw "Exact checkout mismatch. expected=$env:RG_EXPECTED_SHA actual=$actual"
          }
          if($env:RG_EXPECTED_SHA -notmatch '^[0-9a-fA-F]{40}$'){throw 'expected_sha must be exactly 40 hexadecimal characters.'}
          $artifactId=0L
          if(-not [long]::TryParse($env:RG_FROZEN_PACKAGE_ARTIFACT_ID,[ref]$artifactId) -or $artifactId -le 0){
            throw 'package_artifact_id must be a positive integer.'
          }
          if([string]::IsNullOrWhiteSpace($env:RANSOMGUARD_LAB_CERT_THUMBPRINT)){throw 'LAB certificate thumbprint is required.'}
          .\minifilter-tools\verify_runtime_runner_readiness.ps1 -CertificateThumbprint $env:RANSOMGUARD_LAB_CERT_THUMBPRINT

      - name: Refuse unexpected loaded minifilter
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $filters=(& fltmc filters 2>$null | Out-String)
          if($LASTEXITCODE -ne 0){throw "Unable to query Filter Manager, exit=$LASTEXITCODE"}
          if($filters -match '(?m)^\s*RansomGuardMinifilter\b'){
            throw 'REFUSED: RansomGuardMinifilter is already loaded before frozen-package Driver Verifier phase.'
          }

      - name: Setup .NET 10
        if: ${{ inputs.phase == 'runtime' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0 node24 pinned
        with:
          dotnet-version: 10.0.401

      - name: Build frozen candidate LAB userspace bundle
        if: ${{ inputs.phase == 'runtime' }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          .\build_lab.cmd
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $lab=Get-ChildItem .\release -Directory -Filter 'RansomGuard-Lab-v*' | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if(-not $lab){throw 'Engineering LAB release directory not found.'}
          "RG_LAB_RELEASE=$($lab.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Import immutable frozen package
        if: ${{ inputs.phase == 'arm' || inputs.phase == 'runtime' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference='Stop'
          $artifactId=[long]$env:RG_FROZEN_PACKAGE_ARTIFACT_ID
          $package=Join-Path $env:RUNNER_TEMP 'ransomguard-frozen-verifier-driver'
          .\orchestrator\qualification\import_frozen_candidate_package.ps1 -ArtifactId $artifactId -ExpectedSha $env:RG_EXPECTED_SHA -Repository $env:GH_REPO -OutputDirectory $package | Write-Host
          $runtime=Get-Content -LiteralPath (Join-Path $package 'runtime-package.json') -Raw | ConvertFrom-Json
          $expectedThumb=$env:RANSOMGUARD_LAB_CERT_THUMBPRINT.Replace(' ','').ToUpperInvariant()
          if(-not [string]::Equals([string]$runtime.certificateThumbprint,$expectedThumb,[StringComparison]::OrdinalIgnoreCase)){
            throw 'Frozen package certificate thumbprint does not match the configured LAB certificate.'
          }
          "RG_DRIVER_PACKAGE=$package" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RG_FROZEN_PACKAGE_IMPORT_RESULT=$(Join-Path $package 'frozen-package-import-result.json')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Bind frozen package to verifier campaign
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=[IO.Path]::GetFullPath($env:RG_VERIFIER_ROOT_BASE)
          if($root -notmatch '(?i)RansomGuard'){throw 'root_base must contain RansomGuard.'}
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $bindingPath=Join-Path $root 'frozen-package-binding.json'
          $hashPath=$bindingPath+'.sha256'

          if($env:RG_VERIFIER_PHASE -eq 'arm'){
            if(Test-Path -LiteralPath $bindingPath -PathType Leaf){throw "Frozen verifier binding already exists: $bindingPath"}
            $import=Get-Content -LiteralPath $env:RG_FROZEN_PACKAGE_IMPORT_RESULT -Raw | ConvertFrom-Json -Depth 30
            $binding=[ordered]@{
              schema=1
              frozenCandidateSha=$env:RG_EXPECTED_SHA.ToLowerInvariant()
              packageArtifactId=[long]$env:RG_FROZEN_PACKAGE_ARTIFACT_ID
              sysSha256=[string]$import.artifacts.'RansomGuardMinifilter.sys'.sha256
              infSha256=[string]$import.artifacts.'RansomGuardMinifilter.inf'.sha256
              catSha256=[string]$import.artifacts.'RansomGuardMinifilter.cat'.sha256
              createdUtc=[DateTimeOffset]::UtcNow.ToString('o')
            }
            $binding | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $bindingPath -Encoding utf8
            (Get-FileHash -LiteralPath $bindingPath -Algorithm SHA256).Hash | Set-Content -LiteralPath $hashPath -Encoding ascii
          }else{
            if(-not(Test-Path -LiteralPath $bindingPath -PathType Leaf) -or -not(Test-Path -LiteralPath $hashPath -PathType Leaf)){
              throw 'Frozen verifier package binding is missing after reboot.'
            }
            $expectedHash=(Get-Content -LiteralPath $hashPath -Raw).Trim()
            $actualHash=(Get-FileHash -LiteralPath $bindingPath -Algorithm SHA256).Hash
            if(-not [string]::Equals($expectedHash,$actualHash,[StringComparison]::OrdinalIgnoreCase)){throw 'Frozen verifier binding hash mismatch.'}
            $binding=Get-Content -LiteralPath $bindingPath -Raw | ConvertFrom-Json -Depth 20
            if([int]$binding.schema -ne 1){throw 'Frozen verifier binding schema must be 1.'}
            if(-not [string]::Equals([string]$binding.frozenCandidateSha,$env:RG_EXPECTED_SHA,[StringComparison]::OrdinalIgnoreCase)){throw 'Frozen verifier binding source SHA mismatch.'}
            if([long]$binding.packageArtifactId -ne [long]$env:RG_FROZEN_PACKAGE_ARTIFACT_ID){throw 'Frozen verifier binding artifact id mismatch.'}

            if($env:RG_VERIFIER_PHASE -eq 'runtime'){
              $import=Get-Content -LiteralPath $env:RG_FROZEN_PACKAGE_IMPORT_RESULT -Raw | ConvertFrom-Json -Depth 30
              foreach($pair in @(
                @('sysSha256','RansomGuardMinifilter.sys'),
                @('infSha256','RansomGuardMinifilter.inf'),
                @('catSha256','RansomGuardMinifilter.cat')
              )){
                $bound=[string]$binding.($pair[0])
                $imported=[string]$import.artifacts.($pair[1]).sha256
                if(-not [string]::Equals($bound,$imported,[StringComparison]::OrdinalIgnoreCase)){
                  throw "Frozen verifier package changed across reboot for $($pair[1])."
                }
              }
            }
          }

          "RG_FROZEN_BINDING_PATH=$bindingPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RG_FROZEN_BINDING_HASH_PATH=$hashPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: ARM standard one-boot Driver Verifier
        if: ${{ inputs.phase == 'arm' }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $results=Join-Path $env:RUNNER_TEMP 'ransomguard-frozen-verifier-arm-results'
          if(Test-Path -LiteralPath $results){Remove-Item -LiteralPath $results -Recurse -Force}
          New-Item -ItemType Directory -Path $results -Force | Out-Null
          .\minifilter-tools\arm_driver_verifier_lab.ps1 -DriverPackageDirectory $env:RG_DRIVER_PACKAGE -RootBase $env:RG_VERIFIER_ROOT_BASE -ResultsDirectory $results
          $summary=Get-Content -LiteralPath (Join-Path $results 'driver-verifier-arm-result.json') -Raw | ConvertFrom-Json
          foreach($name in @('cleanVerifierState','driverPackageRegistered','targetOnlyConfigured','standardFlagsConfigured','querySettingsConfirmed','oneBootCommandSucceeded','stateDurable','rebootRequired','passed')){
            if($summary.$name -ne $true){throw "Frozen Driver Verifier ARM invariant '$name' was not true."}
          }
          Copy-Item -LiteralPath $env:RG_FROZEN_BINDING_PATH -Destination (Join-Path $results 'frozen-package-binding.json') -Force
          Copy-Item -LiteralPath $env:RG_FROZEN_PACKAGE_IMPORT_RESULT -Destination (Join-Path $results 'frozen-package-import-result.json') -Force
          "RG_VERIFIER_RESULTS=$results" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run bounded stress under Driver Verifier
        if: ${{ inputs.phase == 'runtime' }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parallel=0
          if(-not [int]::TryParse($env:RG_VERIFIER_PARALLELISM,[ref]$parallel) -or $parallel -lt 9 -or $parallel -gt 32){throw 'parallelism must be 9-32.'}
          $results=Join-Path $env:RUNNER_TEMP 'ransomguard-frozen-verifier-runtime-results'
          if(Test-Path -LiteralPath $results){Remove-Item -LiteralPath $results -Recurse -Force}
          New-Item -ItemType Directory -Path $results -Force | Out-Null
          .\minifilter-tools\run_driver_verifier_lab.ps1 -LabReleaseDirectory $env:RG_LAB_RELEASE -DriverPackageDirectory $env:RG_DRIVER_PACKAGE -RootBase $env:RG_VERIFIER_ROOT_BASE -StressRootBase $env:RG_VERIFIER_STRESS_ROOT_BASE -ResultsDirectory $results -Parallelism $parallel
          $summary=Get-Content -LiteralPath (Join-Path $results 'driver-verifier-runtime-result.json') -Raw | ConvertFrom-Json
          foreach($name in @('bootChanged','armStandardSettingsBound','verifierObservedTargetLoaded','noBugcheckBeforeStress','stressPassed','noBugcheckAfterStress','resetCommandSucceeded','persistentSettingsCleared','resetStateDurable','rebootRequired','passed')){
            if($summary.$name -ne $true){throw "Frozen Driver Verifier runtime invariant '$name' was not true."}
          }
          Copy-Item -LiteralPath $env:RG_FROZEN_BINDING_PATH -Destination (Join-Path $results 'frozen-package-binding.json') -Force
          Copy-Item -LiteralPath $env:RG_FROZEN_PACKAGE_IMPORT_RESULT -Destination (Join-Path $results 'frozen-package-import-result.json') -Force
          "RG_VERIFIER_RESULTS=$results" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prove Driver Verifier clear after reset reboot
        if: ${{ inputs.phase == 'clear' }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $results=Join-Path $env:RUNNER_TEMP 'ransomguard-frozen-verifier-clear-results'
          if(Test-Path -LiteralPath $results){Remove-Item -LiteralPath $results -Recurse -Force}
          New-Item -ItemType Directory -Path $results -Force | Out-Null
          .\minifilter-tools\verify_driver_verifier_clear_lab.ps1 -RootBase $env:RG_VERIFIER_ROOT_BASE -ResultsDirectory $results
          $summary=Get-Content -LiteralPath (Join-Path $results 'driver-verifier-clear-result.json') -Raw | ConvertFrom-Json
          foreach($name in @('bootChanged','persistentSettingsAbsent','querySettingsClear','currentActivityClear','filterNotLoaded','activeCampaignArchived','passed')){
            if($summary.$name -ne $true){throw "Frozen Driver Verifier CLEAR invariant '$name' was not true."}
          }
          Copy-Item -LiteralPath $env:RG_FROZEN_BINDING_PATH -Destination (Join-Path $results 'frozen-package-binding.json') -Force
          Remove-Item -LiteralPath $env:RG_FROZEN_BINDING_PATH -Force
          Remove-Item -LiteralPath $env:RG_FROZEN_BINDING_HASH_PATH -Force
          "RG_VERIFIER_RESULTS=$results" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload frozen-package Driver Verifier evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 node24 pinned
        with:
          name: ransomguard-frozen-verifier-${{ inputs.phase }}-${{ inputs.expected_sha }}-artifact-${{ inputs.package_artifact_id }}
          path: ${{ env.RG_VERIFIER_RESULTS }}/**
          if-no-files-found: warn
          retention-days: 30

      - name: Remove imported package
        if: ${{ always() && (inputs.phase == 'arm' || inputs.phase == 'runtime') }}
        shell: pwsh
        run: |
          if($env:RG_DRIVER_PACKAGE -and (Test-Path -LiteralPath $env:RG_DRIVER_PACKAGE)){
            Remove-Item -LiteralPath $env:RG_DRIVER_PACKAGE -Recurse -Force -ErrorAction SilentlyContinue
          }
