name: RansomGuard frozen candidate package provenance

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact frozen candidate SHA to build and archive.
        required: true
        type: string

permissions:
  contents: read

jobs:
  provenance:
    environment: ransomguard-lab-vm
    runs-on: [self-hosted, Windows, X64, ransomguard-lab-vm]
    timeout-minutes: 20
    env:
      RANSOMGUARD_LAB_VM: I_UNDERSTAND
      RANSOMGUARD_LAB_CERT_THUMBPRINT: ${{ secrets.RANSOMGUARD_LAB_CERT_THUMBPRINT }}
      RG_EXPECTED_SHA: ${{ inputs.expected_sha }}

    steps:
      - name: Checkout policy source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24 pinned
        with:
          ref: main
          fetch-depth: 1

      - name: Verify threat-model policy
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          .\tools\verify_threat_model.ps1

      - name: Validate requested SHA
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RG_EXPECTED_SHA -notmatch '^[0-9a-fA-F]{40}$'){
            throw 'expected_sha must be exactly 40 hexadecimal characters.'
          }

      - name: Checkout exact frozen candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24 pinned
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1

      - name: Verify exact checkout and runner readiness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $actual=(git rev-parse HEAD).Trim()
          if(-not [string]::Equals($actual,$env:RG_EXPECTED_SHA,[StringComparison]::OrdinalIgnoreCase)){
            throw "Exact checkout mismatch. expected=$env:RG_EXPECTED_SHA actual=$actual"
          }
          if([string]::IsNullOrWhiteSpace($env:RANSOMGUARD_LAB_CERT_THUMBPRINT)){
            throw 'Environment secret RANSOMGUARD_LAB_CERT_THUMBPRINT is required.'
          }
          .\minifilter-tools\verify_runtime_runner_readiness.ps1 -CertificateThumbprint $env:RANSOMGUARD_LAB_CERT_THUMBPRINT

      - name: Build exact candidate driver package and provenance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $package=Join-Path $env:RUNNER_TEMP 'ransomguard-frozen-candidate-package'
          if(Test-Path -LiteralPath $package){Remove-Item -LiteralPath $package -Recurse -Force}
          .\minifilter-tools\prepare_runtime_driver_package.ps1 -CertificateThumbprint $env:RANSOMGUARD_LAB_CERT_THUMBPRINT -OutputDirectory $package

          $provPath=Join-Path $package 'runtime-package.json'
          $provenance=Get-Content -LiteralPath $provPath -Raw | ConvertFrom-Json
          if([int]$provenance.schema -ne 2){throw "Runtime package provenance schema must be 2. Found '$($provenance.schema)'."}
          if(-not [string]::Equals([string]$provenance.commit,$env:RG_EXPECTED_SHA,[StringComparison]::OrdinalIgnoreCase)){
            throw "Runtime package provenance commit '$($provenance.commit)' does not match frozen candidate '$env:RG_EXPECTED_SHA'."
          }

          $artifacts=[ordered]@{}
          foreach($name in @('RansomGuardMinifilter.sys','RansomGuardMinifilter.inf','RansomGuardMinifilter.cat')){
            $path=Join-Path $package $name
            if(-not(Test-Path -LiteralPath $path -PathType Leaf)){throw "Required package artifact is missing: $name"}
            $artifacts[$name]=[ordered]@{
              sha256=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
              bytes=(Get-Item -LiteralPath $path).Length
            }
          }

          if(-not [string]::Equals([string]$provenance.sysSha256,[string]$artifacts['RansomGuardMinifilter.sys'].sha256,[StringComparison]::OrdinalIgnoreCase)){throw 'SYS provenance hash mismatch.'}
          if(-not [string]::Equals([string]$provenance.infSha256,[string]$artifacts['RansomGuardMinifilter.inf'].sha256,[StringComparison]::OrdinalIgnoreCase)){throw 'INF provenance hash mismatch.'}
          if(-not [string]::Equals([string]$provenance.catSha256,[string]$artifacts['RansomGuardMinifilter.cat'].sha256,[StringComparison]::OrdinalIgnoreCase)){throw 'CAT provenance hash mismatch.'}

          [ordered]@{
            schema=1
            frozenCandidateSha=$env:RG_EXPECTED_SHA
            runtimePackage=$provenance
            artifacts=$artifacts
            generatedUtc=[DateTimeOffset]::UtcNow.ToString('o')
            qualificationOnly=$true
            signingBoundary='Disposable VM LAB certificate; not production/EV signing evidence.'
          } | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath (Join-Path $package 'frozen-candidate-attestation.json') -Encoding utf8

          "RG_FROZEN_PACKAGE=$package" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload exact candidate package provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 node24 pinned
        with:
          name: ransomguard-frozen-candidate-package-${{ inputs.expected_sha }}
          path: ${{ env.RG_FROZEN_PACKAGE }}/**
          if-no-files-found: error
          retention-days: 30

      - name: Remove signed LAB package
        if: ${{ always() }}
        shell: pwsh
        run: |
          if($env:RG_FROZEN_PACKAGE -and (Test-Path -LiteralPath $env:RG_FROZEN_PACKAGE)){
            Remove-Item -LiteralPath $env:RG_FROZEN_PACKAGE -Recurse -Force -ErrorAction SilentlyContinue
          }
