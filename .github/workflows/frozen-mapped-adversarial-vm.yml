name: RansomGuard frozen mapped adversarial qualification

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact frozen candidate source SHA.
        required: true
        type: string
      package_artifact_id:
        description: Immutable frozen candidate package artifact id.
        required: true
        type: string
      root_base:
        description: Disposable VM-only qualification root. Must contain RansomGuard.
        required: true
        default: C:\RansomGuard-VM-MappedAdversarial
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ransomguard-frozen-mapped-adversarial-vm
  cancel-in-progress: false

jobs:
  mapped:
    environment: ransomguard-lab-vm
    runs-on: [self-hosted, Windows, X64, ransomguard-lab-vm]
    timeout-minutes: 70
    env:
      RANSOMGUARD_LAB_VM: I_UNDERSTAND
      RANSOMGUARD_LAB_CERT_THUMBPRINT: ${{ secrets.RANSOMGUARD_LAB_CERT_THUMBPRINT }}
      RG_EXPECTED_SHA: ${{ inputs.expected_sha }}
      RG_FROZEN_PACKAGE_ARTIFACT_ID: ${{ inputs.package_artifact_id }}
      RG_ROOT_BASE: ${{ inputs.root_base }}

    steps:
      - name: Checkout exact frozen candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24 pinned
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1

      - name: Checkout orchestration policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24 pinned
        with:
          ref: main
          path: orchestrator
          fetch-depth: 1

      - name: Verify exact candidate and orchestration policy
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location .\orchestrator
          try{
            .\tools\verify_powershell_automation.ps1
            .\tools\verify_supply_chain.ps1
            .\tools\verify_threat_model.ps1
          }finally{Pop-Location}

          .\tools\verify_powershell_automation.ps1
          .\tools\verify_supply_chain.ps1
          .\tools\verify_threat_model.ps1

          $actual=(git rev-parse HEAD).Trim()
          if(-not [string]::Equals($actual,$env:RG_EXPECTED_SHA,[StringComparison]::OrdinalIgnoreCase)){
            throw "Exact checkout mismatch. expected=$env:RG_EXPECTED_SHA actual=$actual"
          }
          if([string]::IsNullOrWhiteSpace($env:RANSOMGUARD_LAB_CERT_THUMBPRINT)){
            throw 'Environment secret RANSOMGUARD_LAB_CERT_THUMBPRINT is required.'
          }

      - name: Clear stale LAB minifilter
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=[IO.Path]::GetFullPath($env:RG_ROOT_BASE)
          $volume=[IO.Path]::GetPathRoot($root).TrimEnd('\')
          $filters=(& fltmc filters 2>$null | Out-String)
          if($LASTEXITCODE -ne 0){throw "Unable to query Filter Manager, exit=$LASTEXITCODE"}
          if($filters -match '(?m)^\s*RansomGuardMinifilter\b'){
            .\minifilter-tools\unload_minifilter_lab.ps1 -Volume $volume
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0 node24 pinned
        with:
          dotnet-version: 10.0.401

      - name: Build exact frozen candidate LAB bundle
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          .\build_lab.cmd
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $lab=Get-ChildItem .\release -Directory -Filter 'RansomGuard-Lab-v*' | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if(-not $lab){throw 'Engineering LAB release directory not found.'}
          "RG_LAB_RELEASE=$($lab.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build qualification-only mapped probe helper
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $output=Join-Path $env:RUNNER_TEMP 'ransomguard-mapped-probe-helper'
          dotnet publish .\orchestrator\tests\RansomGuard.Minifilter.RuntimeHarness\RansomGuard.Minifilter.RuntimeHarness.csproj `
            -c Release -r win-x64 --self-contained true --locked-mode `
            -p:PublishSingleFile=true -o $output
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $helper=Join-Path $output 'RansomGuard.Minifilter.RuntimeHarness.exe'
          if(-not(Test-Path -LiteralPath $helper -PathType Leaf)){throw 'Mapped qualification helper was not published.'}
          "RG_MAPPED_HELPER=$helper" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Import immutable frozen driver package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference='Stop'
          $artifactId=0L
          if(-not [long]::TryParse($env:RG_FROZEN_PACKAGE_ARTIFACT_ID,[ref]$artifactId) -or $artifactId -le 0){
            throw 'package_artifact_id must be a positive integer.'
          }
          $package=Join-Path $env:RUNNER_TEMP 'ransomguard-frozen-mapped-driver'
          .\orchestrator\qualification\import_frozen_candidate_package.ps1 -ArtifactId $artifactId -ExpectedSha $env:RG_EXPECTED_SHA -Repository $env:GH_REPO -OutputDirectory $package | Write-Host
          "RG_DRIVER_PACKAGE=$package" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run mapped I/O adversarial qualification
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $results=Join-Path $env:RUNNER_TEMP 'ransomguard-mapped-adversarial-results'
          .\orchestrator\qualification\run_mapped_adversarial_matrix.ps1 `
            -CandidateRoot (Resolve-Path .).Path `
            -LabReleaseDirectory $env:RG_LAB_RELEASE `
            -DriverPackageDirectory $env:RG_DRIVER_PACKAGE `
            -ProbeHelperExe $env:RG_MAPPED_HELPER `
            -ExpectedSha $env:RG_EXPECTED_SHA `
            -RootBase $env:RG_ROOT_BASE `
            -ResultsDirectory $results

          $summary=Get-Content -LiteralPath (Join-Path $results 'mapped-adversarial-result.json') -Raw | ConvertFrom-Json
          foreach($name in @(
            'mappedLossFailSafe','mappedLossPreimageProven',
            'mappingRenameSafe','mappingRenamePreimageProven',
            'mappingTruncateSafe','mappingTruncatePreimageProven',
            'mappingDeleteSafe','mappingDeletePreimageProven',
            'dirtyFlushBoundarySafe','dirtyFlushPreimageProven',
            'cleanupPassed','passed'
          )){
            if($summary.$name -ne $true){throw "Mapped adversarial invariant '$name' was not true."}
          }
          "RG_MAPPED_RESULTS=$results" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload mapped adversarial evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 node24 pinned
        with:
          name: ransomguard-frozen-mapped-adversarial-${{ inputs.expected_sha }}-artifact-${{ inputs.package_artifact_id }}
          path: |
            ${{ env.RG_MAPPED_RESULTS }}/**
          if-no-files-found: warn
          retention-days: 30

      - name: Remove imported qualification package
        if: ${{ always() }}
        shell: pwsh
        run: |
          if($env:RG_DRIVER_PACKAGE -and (Test-Path -LiteralPath $env:RG_DRIVER_PACKAGE)){
            Remove-Item -LiteralPath $env:RG_DRIVER_PACKAGE -Recurse -Force -ErrorAction SilentlyContinue
          }
