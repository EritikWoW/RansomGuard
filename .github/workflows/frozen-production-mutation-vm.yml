name: RansomGuard frozen ProductionGate mutation matrix

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact frozen candidate SHA to qualify.
        required: true
        type: string
      package_artifact_id:
        description: Artifact id of ransomguard-frozen-candidate-package-<expected_sha>.
        required: true
        type: string
      root_base:
        description: Disposable VM-only root for production mutation qualification.
        required: true
        default: C:\RansomGuard-VM-ProductionMutation
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ransomguard-production-mutation-vm
  cancel-in-progress: false

jobs:
  production-mutation:
    environment: ransomguard-lab-vm
    runs-on: [self-hosted, Windows, X64, ransomguard-lab-vm]
    timeout-minutes: 45
    env:
      RANSOMGUARD_LAB_VM: I_UNDERSTAND
      RANSOMGUARD_LAB_CERT_THUMBPRINT: ${{ secrets.RANSOMGUARD_LAB_CERT_THUMBPRINT }}
      RG_EXPECTED_SHA: ${{ inputs.expected_sha }}
      RG_FROZEN_PACKAGE_ARTIFACT_ID: ${{ inputs.package_artifact_id }}
      RG_MUTATION_ROOT_BASE: ${{ inputs.root_base }}

    steps:
      - name: Checkout orchestration policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24 pinned
        with:
          ref: main
          path: orchestrator
          fetch-depth: 1

      - name: Verify orchestration policy
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location .\orchestrator
          try{
            .\tools\verify_powershell_automation.ps1
            .\tools\verify_supply_chain.ps1
            .\tools\verify_threat_model.ps1
          }finally{Pop-Location}

      - name: Validate exact candidate request
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RG_EXPECTED_SHA -notmatch '^[0-9a-fA-F]{40}$'){
            throw 'expected_sha must be exactly 40 hexadecimal characters.'
          }
          $root=[IO.Path]::GetFullPath($env:RG_MUTATION_ROOT_BASE)
          if($root -notmatch '(?i)RansomGuard'){throw 'root_base must contain RansomGuard.'}
          if($root -eq [IO.Path]::GetPathRoot($root).TrimEnd('\')){throw 'root_base cannot be an entire drive.'}

      - name: Checkout exact frozen candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24 pinned
        with:
          ref: ${{ inputs.expected_sha }}
          path: candidate
          fetch-depth: 1

      - name: Verify exact candidate checkout and VM readiness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location .\candidate
          try{
            $actual=(git rev-parse HEAD).Trim()
            if(-not [string]::Equals($actual,$env:RG_EXPECTED_SHA,[StringComparison]::OrdinalIgnoreCase)){
              throw "Exact checkout mismatch. expected=$env:RG_EXPECTED_SHA actual=$actual"
            }
            if([string]::IsNullOrWhiteSpace($env:RANSOMGUARD_LAB_CERT_THUMBPRINT)){
              throw 'Environment secret RANSOMGUARD_LAB_CERT_THUMBPRINT is required.'
            }
            .\minifilter-tools\verify_runtime_runner_readiness.ps1 -CertificateThumbprint $env:RANSOMGUARD_LAB_CERT_THUMBPRINT
          }finally{Pop-Location}

      - name: Refuse stale loaded minifilter
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $filters=(& fltmc filters 2>$null | Out-String)
          if($LASTEXITCODE -ne 0){throw "Unable to query Filter Manager, exit=$LASTEXITCODE"}
          if($filters -match '(?m)^\s*RansomGuardMinifilter\b'){
            throw 'REFUSED: RansomGuardMinifilter is already loaded before frozen ProductionGate mutation qualification.'
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0 node24 pinned
        with:
          dotnet-version: 10.0.401

      - name: Build orchestration FSCTL qualification probe
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'ransomguard-fsctl-qualification-probe'
          if(Test-Path -LiteralPath $out){Remove-Item -LiteralPath $out -Recurse -Force}
          $project='.\orchestrator\qualification\RansomGuard.FsctlQualificationProbe\RansomGuard.FsctlQualificationProbe.csproj'
          dotnet restore $project --locked-mode -r win-x64 -p:SelfContained=true
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          dotnet publish $project -c Release -r win-x64 --self-contained true --no-restore -o $out
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $exe=Join-Path $out 'RansomGuard.FsctlQualificationProbe.exe'
          if(-not(Test-Path -LiteralPath $exe -PathType Leaf)){throw "FSCTL qualification probe missing: $exe"}
          "RG_FSCTL_QUALIFICATION_PROBE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build exact candidate Engineering LAB bundle
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location .\candidate
          try{
            .\build_lab.cmd
            if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
            $lab=Get-ChildItem .\release -Directory -Filter 'RansomGuard-Lab-v*' | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
            if(-not $lab){throw 'Engineering LAB release directory not found.'}
            "RG_LAB_RELEASE=$($lab.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }finally{Pop-Location}

      - name: Import immutable frozen candidate driver package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference='Stop'
          $artifactId=0L
          if(-not [long]::TryParse($env:RG_FROZEN_PACKAGE_ARTIFACT_ID,[ref]$artifactId) -or $artifactId -le 0){
            throw "package_artifact_id must be a positive integer. Found '$env:RG_FROZEN_PACKAGE_ARTIFACT_ID'."
          }
          $package=Join-Path $env:RUNNER_TEMP 'ransomguard-production-mutation-frozen-driver'
          .\orchestrator\qualification\import_frozen_candidate_package.ps1 -ArtifactId $artifactId -ExpectedSha $env:RG_EXPECTED_SHA -Repository $env:GH_REPO -OutputDirectory $package | Write-Host
          "RG_MUTATION_DRIVER_PACKAGE=$package" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RG_FROZEN_PACKAGE_IMPORT_RESULT=$(Join-Path $package 'frozen-package-import-result.json')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run frozen ProductionGate mutation matrix
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $results=Join-Path $env:RUNNER_TEMP 'ransomguard-production-mutation-results'
          if(Test-Path -LiteralPath $results){Remove-Item -LiteralPath $results -Recurse -Force}
          New-Item -ItemType Directory -Path $results -Force | Out-Null
          "RG_MUTATION_RESULTS=$results" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          .\orchestrator\qualification\run_frozen_production_mutation_matrix.ps1 `
            -CandidateRoot (Resolve-Path .\candidate).Path `
            -LabReleaseDirectory $env:RG_LAB_RELEASE `
            -DriverPackageDirectory $env:RG_MUTATION_DRIVER_PACKAGE `
            -FsctlHelperExe $env:RG_FSCTL_QUALIFICATION_PROBE `
            -ExpectedSha $env:RG_EXPECTED_SHA `
            -RootBase $env:RG_MUTATION_ROOT_BASE `
            -ResultsDirectory $results

          $summary=Get-Content -LiteralPath (Join-Path $results 'production-mutation-matrix-result.json') -Raw | ConvertFrom-Json
          foreach($name in @(
            'dormantWritableHandleRejected',
            'preexistingWritableMappingRejected',
            'preexistingHardLinkRejected',
            'descendantReparseRejected',
            'postActivationReparseMutationDenied',
            'hardLinkInsideToOutsideDenied',
            'hardLinkOutsideToInsideDenied',
            'hardLinkOutsideToOutsideAllowed',
            'hardLinkExInsideToOutsideDenied',
            'hardLinkExOutsideToInsideDenied',
            'hardLinkExOutsideToOutsideAllowed',
            'fsctlZeroAllowedWithBaseline',
            'fsctlZeroMutatedTarget',
            'fsctlZeroPreimageHashMatched',
            'ntfsQualified',
            'fsctlSetSparseQualified',
            'fsctlFileLevelTrimQualified',
            'fsctlDuplicateExtentsQualified',
            'fsctlDuplicateExtentsExQualified',
            'fsctlOffloadWriteQualified',
            'postActivationMappedWriteMutatedTarget',
            'postActivationMappedWritePreimageHashMatched',
            'cleanupPassed',
            'passed'
          )){
            if($summary.$name -ne $true){throw "Production mutation invariant '$name' was not true."}
          }
          if(-not [string]::Equals([string]$summary.frozenCandidateSha,$env:RG_EXPECTED_SHA,[StringComparison]::OrdinalIgnoreCase)){
            throw 'Production mutation evidence is not bound to the requested frozen candidate SHA.'
          }

          $import=Get-Content -LiteralPath $env:RG_FROZEN_PACKAGE_IMPORT_RESULT -Raw | ConvertFrom-Json -Depth 20
          foreach($pair in @(
            @('driverSysSha256','RansomGuardMinifilter.sys'),
            @('driverInfSha256','RansomGuardMinifilter.inf'),
            @('driverCatSha256','RansomGuardMinifilter.cat')
          )){
            $actual=[string]$summary.($pair[0])
            $expected=[string]$import.artifacts.($pair[1]).sha256
            if(-not [string]::Equals($actual,$expected,[StringComparison]::OrdinalIgnoreCase)){
              throw "Production mutation matrix used a different $($pair[1]) than the immutable frozen package. expected=$expected actual=$actual"
            }
          }

      - name: Upload frozen ProductionGate mutation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 node24 pinned
        with:
          name: ransomguard-frozen-production-mutation-${{ inputs.expected_sha }}
          path: ${{ runner.temp }}/ransomguard-production-mutation-results/**
          if-no-files-found: warn
          retention-days: 30

      - name: Remove signed LAB package
        if: ${{ always() }}
        shell: pwsh
        run: |
          if($env:RG_MUTATION_DRIVER_PACKAGE -and (Test-Path -LiteralPath $env:RG_MUTATION_DRIVER_PACKAGE)){
            Remove-Item -LiteralPath $env:RG_MUTATION_DRIVER_PACKAGE -Recurse -Force -ErrorAction SilentlyContinue
          }
