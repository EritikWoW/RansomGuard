name: Minifilter runtime VM lab

on:
  workflow_dispatch:
    inputs:
      root_base:
        description: Disposable VM-only root base. Must contain RansomGuard.
        required: true
        default: C:\RansomGuard-VM-Integration
        type: string

permissions:
  contents: read

concurrency:
  group: ransomguard-runtime-vm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime:
    environment: ransomguard-lab-vm
    runs-on: [self-hosted, Windows, X64, ransomguard-lab-vm]
    timeout-minutes: 60
    env:
      RANSOMGUARD_LAB_VM: I_UNDERSTAND
      RANSOMGUARD_LAB_CERT_THUMBPRINT: ${{ secrets.RANSOMGUARD_LAB_CERT_THUMBPRINT }}
      RG_RUNTIME_ROOT_BASE: ${{ inputs.root_base }}
      RG_WORKFLOW_SHA: ${{ github.sha }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24 pinned # v4 pinned
        with:
          fetch-depth: 1

      - name: Audit PowerShell automation and supply chain
        shell: pwsh
        run: |
          .\tools\verify_powershell_automation.ps1
          .\tools\verify_supply_chain.ps1
          .\tools\verify_threat_model.ps1
          .\tools\verify_production_lifecycle_vm_harness.ps1

      - name: Verify runtime VM runner readiness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:RANSOMGUARD_LAB_CERT_THUMBPRINT)){throw 'Environment secret RANSOMGUARD_LAB_CERT_THUMBPRINT is required.'}
          .\minifilter-tools\verify_runtime_runner_readiness.ps1 -CertificateThumbprint $env:RANSOMGUARD_LAB_CERT_THUMBPRINT

      - name: Clear stale LAB minifilter from prior failed run
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=[IO.Path]::GetFullPath($env:RG_RUNTIME_ROOT_BASE)
          $volume=[IO.Path]::GetPathRoot($root).TrimEnd('\')
          $filters=(& fltmc filters 2>$null | Out-String)
          if($LASTEXITCODE -ne 0){throw "Unable to query Filter Manager before runtime lab, exit=$LASTEXITCODE"}
          if($filters -match '(?m)^\s*RansomGuardMinifilter\b'){
            Write-Warning 'Removing RansomGuardMinifilter left loaded by a prior failed LAB run.'
            .\minifilter-tools\unload_minifilter_lab.ps1 -Volume $volume
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0 node24 pinned # v4 pinned
        with:
          dotnet-version: 10.0.401

      - name: Build Engineering LAB userspace bundle
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          .\build_lab.cmd
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $lab=Get-ChildItem .\release -Directory -Filter 'RansomGuard-Lab-v*' | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          $normal=Get-ChildItem .\release -Directory -Filter 'RansomGuard-v*' | Where-Object { $_.Name -notlike 'RansomGuard-Lab-v*' } | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if(-not $lab){throw 'Engineering LAB release directory not found.'}
          if(-not $normal){throw 'Normal Audit release directory required for production lifecycle qualification was not found.'}
          "RG_LAB_RELEASE=$($lab.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RG_NORMAL_RELEASE=$($normal.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and sign exact-commit runtime driver package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $package=Join-Path $env:RUNNER_TEMP 'ransomguard-runtime-driver'
          .\minifilter-tools\prepare_runtime_driver_package.ps1 -CertificateThumbprint $env:RANSOMGUARD_LAB_CERT_THUMBPRINT -OutputDirectory $package
          $provenance=Get-Content -LiteralPath (Join-Path $package 'runtime-package.json') -Raw | ConvertFrom-Json
          if([int]$provenance.schema -ne 2){throw "Runtime package provenance schema must be 2. Found '$($provenance.schema)'."}
          if($provenance.commit -ne $env:RG_WORKFLOW_SHA){throw "Runtime driver provenance commit '$($provenance.commit)' does not match workflow commit '$env:RG_WORKFLOW_SHA'."}
          $expectedThumb=$env:RANSOMGUARD_LAB_CERT_THUMBPRINT.Replace(' ','').ToUpperInvariant()
          if([string]$provenance.certificateThumbprint -ne $expectedThumb){throw "Runtime package certificate thumbprint '$($provenance.certificateThumbprint)' does not match the configured LAB certificate '$expectedThumb'."}
          [xml]$props=Get-Content -LiteralPath .\Directory.Build.props -Raw
          $expectedVersion=[string]$props.Project.PropertyGroup.Version
          if($provenance.productVersion -ne $expectedVersion){throw "Runtime package version '$($provenance.productVersion)' does not match '$expectedVersion'."}
          foreach($artifact in @(
            @('sysSha256',(Join-Path $package 'RansomGuardMinifilter.sys')),
            @('infSha256',(Join-Path $package 'RansomGuardMinifilter.inf')),
            @('catSha256',(Join-Path $package 'RansomGuardMinifilter.cat'))
          )){
            $expected=[string]$provenance.($artifact[0])
            $actual=(Get-FileHash -LiteralPath $artifact[1] -Algorithm SHA256).Hash
            if(-not [string]::Equals($expected,$actual,[StringComparison]::OrdinalIgnoreCase)){
              throw "Runtime package artifact hash mismatch for $($artifact[1])."
            }
          }
          "RG_DRIVER_PACKAGE=$package" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run activation, GateClient-loss, mapping and containment scenarios
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $results=Join-Path $env:RUNNER_TEMP 'ransomguard-runtime-results'
          if(Test-Path -LiteralPath $results){
            Remove-Item -LiteralPath $results -Recurse -Force
          }
          New-Item -ItemType Directory -Path $results -Force | Out-Null
          .\minifilter-tools\run_runtime_integration_lab.ps1 -LabReleaseDirectory $env:RG_LAB_RELEASE -DriverPackageDirectory $env:RG_DRIVER_PACKAGE -RootBase $env:RG_RUNTIME_ROOT_BASE -ResultsDirectory $results
          $summary=Get-Content -LiteralPath (Join-Path $results 'runtime-result.json') -Raw | ConvertFrom-Json
          if([int]$summary.schema -ne 2){throw "Runtime result schema must be 2. Found '$($summary.schema)'."}
          $requiredTrue=@(
            'spoofedClientProcessIdRejected',
            'preexistingDirectoryHandleRejected',
            'dormantWritableHandleRejected',
            'preexistingHardLinkRejected',
            'hardLinkInsideToOutsideDenied',
            'hardLinkOutsideToInsideDenied',
            'hardLinkOutsideToOutsideAllowed',
            'hardLinkExInsideToOutsideDenied',
            'hardLinkExOutsideToInsideDenied',
            'hardLinkExOutsideToOutsideAllowed',
            'fsctlZeroAllowedWithBaseline',
            'fsctlZeroMutatedTarget',
            'fsctlZeroPreimageHashMatched',
            'preexistingMappingRejected',
            'postActivationBaselineVerified',
            'postActivationPagingObserved',
            'preimageHashMatched',
            'disconnectDeniedMutation',
            'disconnectPreservedTargetHash',
            'disconnectReadAllowed',
            'disconnectOutOfRootAllowed',
            'wrongRootReconnectRejected',
            'sameRootReconnectActivated',
            'sameRootMutationAllowed',
            'gracefulReleaseSucceeded',
            'scopeAmbiguityDeniedMutation',
            'scopeAmbiguityPreservedTargetHash',
            'crossBoundaryRenameDenied',
            'crossBoundaryRenameSourcePreserved',
            'crossBoundaryRenameDestinationAbsent',
            'containmentDeniedTarget',
            'containmentPreservedTargetHash',
            'containmentAllowedPeer',
            'transitionRequested',
            'transitionKernelActive',
            'transitionDeniedNextWrite',
            'cleanupPassed',
            'passed'
          )
          foreach($name in $requiredTrue){
            if($summary.$name -ne $true){throw "Runtime result invariant '$name' was not true."}
          }
          if(-not [string]::IsNullOrWhiteSpace([string]$summary.cleanupError)){
            throw "Runtime cleanup reported an error: $($summary.cleanupError)"
          }
          "RG_RUNTIME_RESULTS=$results" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run NTFS and ReFS filesystem compatibility matrix
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $matrixResults=Join-Path $env:RUNNER_TEMP 'ransomguard-filesystem-matrix-results'
          $matrixScratch=Join-Path $env:RUNNER_TEMP 'RansomGuard-Filesystem-Matrix-Scratch'
          if(Test-Path -LiteralPath $matrixResults){
            Remove-Item -LiteralPath $matrixResults -Recurse -Force
          }
          New-Item -ItemType Directory -Path $matrixResults -Force | Out-Null
          New-Item -ItemType Directory -Path $matrixScratch -Force | Out-Null
          .\minifilter-tools\run_filesystem_matrix_lab.ps1 -LabReleaseDirectory $env:RG_LAB_RELEASE -DriverPackageDirectory $env:RG_DRIVER_PACKAGE -ScratchDirectory $matrixScratch -ResultsDirectory $matrixResults
          $matrix=Get-Content -LiteralPath (Join-Path $matrixResults 'filesystem-matrix-result.json') -Raw | ConvertFrom-Json
          foreach($name in @('ntfsAttempted','ntfsSupported','ntfsPassed','refsAttempted','cleanupPassed','passed')){
            if($matrix.$name -ne $true){throw "Filesystem matrix invariant '$name' was not true."}
          }
          $ntfsScenarios=@($matrix.scenarios | Where-Object {
            [string]::Equals([string]$_.fileSystem,'NTFS',[StringComparison]::OrdinalIgnoreCase) -and $_.supported -eq $true
          })
          if($ntfsScenarios.Count -ne 1 -or $ntfsScenarios[0].unrelatedVolumeAmbiguityAllowed -ne $true){
            throw 'NTFS matrix must prove that forced ambiguity on an attached unrelated volume remains outside the protected-volume gate.'
          }
          if($matrix.refsSupported -eq $true -and $matrix.refsPassed -ne $true){
            throw 'ReFS was supported by the runner but its compatibility scenario did not pass.'
          }
          if($matrix.refsSupported -ne $true -and [string]::IsNullOrWhiteSpace([string]$matrix.refsUnsupportedReason)){
            throw 'ReFS unsupported result must include the runner capability reason.'
          }
          "RG_FS_MATRIX_RESULTS=$matrixResults" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run ProductionGate profile qualification
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $productionResults=Join-Path $env:RUNNER_TEMP 'ransomguard-production-gate-results'
          if(Test-Path -LiteralPath $productionResults){
            Remove-Item -LiteralPath $productionResults -Recurse -Force
          }
          New-Item -ItemType Directory -Path $productionResults -Force | Out-Null
          $productionRoot=$env:RG_RUNTIME_ROOT_BASE + '-ProductionGate'
          .\minifilter-tools\run_production_gate_profile_lab.ps1 -LabReleaseDirectory $env:RG_LAB_RELEASE -DriverPackageDirectory $env:RG_DRIVER_PACKAGE -RootBase $productionRoot -ResultsDirectory $productionResults
          $summary=Get-Content -LiteralPath (Join-Path $productionResults 'production-gate-result.json') -Raw | ConvertFrom-Json
          if([int]$summary.schema -ne 1){throw "ProductionGate result schema must be 1. Found '$($summary.schema)'."}
          foreach($name in @(
            'productionCliRejectedLabOption',
            'productionActivated',
            'productionMutationAllowed',
            'degradedReadAllowed',
            'degradedDeniedMutation',
            'degradedPreservedHash',
            'labProfileReconnectRejected',
            'productionReconnectActivated',
            'productionReconnectMutationAllowed',
            'cleanupPassed',
            'passed'
          )){
            if($summary.$name -ne $true){throw "ProductionGate result invariant '$name' was not true."}
          }
          if([string]$summary.driverCommit -ne $env:RG_WORKFLOW_SHA){
            throw "ProductionGate evidence commit '$($summary.driverCommit)' does not match workflow commit '$env:RG_WORKFLOW_SHA'."
          }
          if(-not [string]::IsNullOrWhiteSpace([string]$summary.cleanupError)){
            throw "ProductionGate cleanup reported an error: $($summary.cleanupError)"
          }
          "RG_PRODUCTION_GATE_RESULTS=$productionResults" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run production service lifecycle qualification
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $package=Join-Path $env:RUNNER_TEMP 'RansomGuard-ProductionLifecycle-Qualification'
          $results=Join-Path $env:RUNNER_TEMP 'ransomguard-production-lifecycle-results'
          foreach($path in @($package,$results)){
            if(Test-Path -LiteralPath $path){Remove-Item -LiteralPath $path -Recurse -Force}
          }
          New-Item -ItemType Directory -Path $results -Force | Out-Null
          .\minifilter-tools\prepare_production_lifecycle_qualification_package.ps1 -NormalReleaseDirectory $env:RG_NORMAL_RELEASE -LabReleaseDirectory $env:RG_LAB_RELEASE -DriverPackageDirectory $env:RG_DRIVER_PACKAGE -CertificateThumbprint $env:RANSOMGUARD_LAB_CERT_THUMBPRINT -OutputDirectory $package
          $packageSummary=Get-Content -LiteralPath (Join-Path $package 'qualification-package.json') -Raw | ConvertFrom-Json
          if([int]$packageSummary.schema -ne 1 -or $packageSummary.qualificationOnly -ne $true){
            throw 'Production lifecycle qualification package provenance is invalid.'
          }
          if([string]$packageSummary.commit -ne $env:RG_WORKFLOW_SHA){
            throw "Production lifecycle qualification package commit '$($packageSummary.commit)' does not match workflow commit '$env:RG_WORKFLOW_SHA'."
          }
          $lifecycleRoot=$env:RG_RUNTIME_ROOT_BASE + '-ProductionLifecycle'
          .\minifilter-tools\run_production_lifecycle_lab.ps1 -QualificationDirectory $package -ExpectedCommit $env:RG_WORKFLOW_SHA -RootBase $lifecycleRoot -ResultsDirectory $results
          $summary=Get-Content -LiteralPath (Join-Path $results 'production-lifecycle-result.json') -Raw | ConvertFrom-Json
          if([int]$summary.schema -ne 1){throw "Production lifecycle result schema must be 1. Found '$($summary.schema)'."}
          foreach($name in @(
            'serviceStarted',
            'admittedAndProtected',
            'productionMutationAllowed',
            'gateClientLossObserved',
            'degradedDeniedMutation',
            'degradedPreservedHash',
            'reconnectProtected',
            'reconnectReplacementObserved',
            'reconnectMutationAllowed',
            'serviceCrashObserved',
            'serviceCrashGateExited',
            'serviceCrashDeniedMutation',
            'serviceCrashPreservedHash',
            'serviceRestartProtected',
            'serviceRestartMutationAllowed',
            'maintenanceStopObserved',
            'driverUnloadedAfterMaintenance',
            'serviceStopped',
            'cleanupPassed',
            'passed'
          )){
            if($summary.$name -ne $true){throw "Production lifecycle result invariant '$name' was not true."}
          }
          if([string]$summary.commit -ne $env:RG_WORKFLOW_SHA){
            throw "Production lifecycle evidence commit '$($summary.commit)' does not match workflow commit '$env:RG_WORKFLOW_SHA'."
          }
          if(-not [string]::IsNullOrWhiteSpace([string]$summary.cleanupError)){
            throw "Production lifecycle cleanup reported an error: $($summary.cleanupError)"
          }
          $auditEvidence=Join-Path $results 'production-lifecycle-audit.json'
          if(-not(Test-Path -LiteralPath $auditEvidence -PathType Leaf) -or [int]$summary.auditEvidenceCount -le 0){
            throw 'Production lifecycle qualification must retain filtered service audit evidence.'
          }
          "RG_PRODUCTION_LIFECYCLE_RESULTS=$results" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ensure LAB minifilter is unloaded after run
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=[IO.Path]::GetFullPath($env:RG_RUNTIME_ROOT_BASE)
          $volume=[IO.Path]::GetPathRoot($root).TrimEnd('\')
          $filters=(& fltmc filters 2>$null | Out-String)
          if($LASTEXITCODE -ne 0){throw "Unable to query Filter Manager during final cleanup, exit=$LASTEXITCODE"}
          $matrixSummary=Join-Path $env:RUNNER_TEMP 'ransomguard-filesystem-matrix-results\filesystem-matrix-result.json'
          if((Test-Path -LiteralPath $matrixSummary) -and
             $filters -match '(?m)^\s*RansomGuardMinifilter\b'){
            $matrix=Get-Content -LiteralPath $matrixSummary -Raw | ConvertFrom-Json
            if($matrix.cleanupPassed -ne $true){
              throw 'STALE MATRIX KERNEL STATE: the filesystem matrix already failed its bounded cleanup and RansomGuardMinifilter is still loaded. Do not retry unload; revert the disposable VM checkpoint.'
            }
          }
          $productionSummary=Join-Path $env:RUNNER_TEMP 'ransomguard-production-gate-results\production-gate-result.json'
          if((Test-Path -LiteralPath $productionSummary) -and
             $filters -match '(?m)^\s*RansomGuardMinifilter\b'){
            $production=Get-Content -LiteralPath $productionSummary -Raw | ConvertFrom-Json
            if($production.cleanupPassed -ne $true){
              throw 'STALE PRODUCTIONGATE KERNEL STATE: ProductionGate qualification failed cleanup and the filter is still loaded. Revert the disposable VM checkpoint.'
            }
          }
          $lifecycleSummary=Join-Path $env:RUNNER_TEMP 'ransomguard-production-lifecycle-results\production-lifecycle-result.json'
          if((Test-Path -LiteralPath $lifecycleSummary) -and
             $filters -match '(?m)^\s*RansomGuardMinifilter\b'){
            $lifecycle=Get-Content -LiteralPath $lifecycleSummary -Raw | ConvertFrom-Json
            if($lifecycle.cleanupPassed -ne $true){
              throw 'STALE PRODUCTION LIFECYCLE KERNEL STATE: service lifecycle qualification failed bounded cleanup and the filter is still loaded. Do not retry unload blindly; revert the disposable VM checkpoint.'
            }
          }
          if($filters -match '(?m)^\s*RansomGuardMinifilter\b'){
            .\minifilter-tools\unload_minifilter_lab.ps1 -Volume $volume
          }

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 node24 pinned # v4 pinned
        with:
          name: ransomguard-minifilter-runtime-evidence
          path: ${{ runner.temp }}/ransomguard-runtime-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload filesystem matrix evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 node24 pinned # v4 pinned
        with:
          name: ransomguard-filesystem-matrix-evidence
          path: ${{ runner.temp }}/ransomguard-filesystem-matrix-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload ProductionGate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 node24 pinned # v4 pinned
        with:
          name: ransomguard-production-gate-evidence
          path: ${{ runner.temp }}/ransomguard-production-gate-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload production lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 node24 pinned # v4 pinned
        with:
          name: ransomguard-production-lifecycle-evidence
          path: ${{ runner.temp }}/ransomguard-production-lifecycle-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: Remove signed qualification packages
        if: always()
        shell: pwsh
        run: |
          if($env:RG_DRIVER_PACKAGE -and (Test-Path -LiteralPath $env:RG_DRIVER_PACKAGE)){
            Remove-Item -LiteralPath $env:RG_DRIVER_PACKAGE -Recurse -Force -ErrorAction SilentlyContinue
          }
          $productionQualification=Join-Path $env:RUNNER_TEMP 'RansomGuard-ProductionLifecycle-Qualification'
          if(Test-Path -LiteralPath $productionQualification){
            Remove-Item -LiteralPath $productionQualification -Recurse -Force -ErrorAction SilentlyContinue
          }
