name: Minifilter Driver Verifier VM lab

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Driver Verifier qualification phase.
        required: true
        default: arm
        type: choice
        options:
          - arm
          - runtime
          - clear
      root_base:
        description: Persistent disposable VM campaign root. Must contain RansomGuard.
        required: true
        default: C:\RansomGuard-VM-Verifier
        type: string
      stress_root_base:
        description: Disposable VM-only protected stress root. Must contain RansomGuard.
        required: true
        default: C:\RansomGuard-VM-Verifier-Stress
        type: string
      parallelism:
        description: Admission-overflow probe width for the runtime phase. Must be 9-32.
        required: true
        default: '16'
        type: string

permissions:
  contents: read

concurrency:
  group: ransomguard-driver-verifier-launcher
  cancel-in-progress: false

jobs:
  verifier-runtime:
    environment: ransomguard-lab-vm
    runs-on: [self-hosted, Windows, X64, ransomguard-lab-vm]
    timeout-minutes: 60
    env:
      RANSOMGUARD_LAB_VM: I_UNDERSTAND
      RANSOMGUARD_LAB_CERT_THUMBPRINT: ${{ secrets.RANSOMGUARD_LAB_CERT_THUMBPRINT }}
      RG_VERIFIER_PHASE: ${{ inputs.phase }}
      RG_VERIFIER_ROOT_BASE: ${{ inputs.root_base }}
      RG_VERIFIER_STRESS_ROOT_BASE: ${{ inputs.stress_root_base }}
      RG_VERIFIER_PARALLELISM: ${{ inputs.parallelism }}

    steps:
      - name: Checkout exact PR 40 Driver Verifier head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24 pinned
        with:
          ref: c8d3db8e77a08f517b9b17d1aebbed9472450396
          fetch-depth: 1

      - name: Bind exact checked-out commit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $expected='c8d3db8e77a08f517b9b17d1aebbed9472450396'
          $actual=(& git rev-parse --verify HEAD).Trim()
          if($LASTEXITCODE -ne 0 -or -not [string]::Equals($actual,$expected,[StringComparison]::OrdinalIgnoreCase)){
            throw "Driver Verifier launcher expected '$expected' but checked out '$actual'."
          }
          Write-Host "Driver Verifier target commit: $actual"
          "RG_WORKFLOW_SHA=$actual" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Audit PowerShell and Driver Verifier harness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          .\tools\verify_powershell_automation.ps1
          .\tools\verify_supply_chain.ps1
          .\tools\verify_driver_verifier_vm_harness.ps1

      - name: Verify disposable VM runner readiness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:RANSOMGUARD_LAB_CERT_THUMBPRINT)){throw 'Environment secret RANSOMGUARD_LAB_CERT_THUMBPRINT is required.'}
          .\minifilter-tools\verify_runtime_runner_readiness.ps1 -CertificateThumbprint $env:RANSOMGUARD_LAB_CERT_THUMBPRINT

      - name: Refuse unexpected loaded LAB minifilter
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $filters=(& fltmc filters 2>$null | Out-String)
          if($LASTEXITCODE -ne 0){throw "Unable to query Filter Manager before Driver Verifier phase, exit=$LASTEXITCODE"}
          if($filters -match '(?m)^\s*RansomGuardMinifilter\b'){
            throw 'REFUSED: RansomGuardMinifilter is already loaded before the requested Driver Verifier phase. Revert/clean the disposable VM rather than hiding stale kernel state.'
          }

      - name: Setup .NET 10
        if: ${{ inputs.phase == 'runtime' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0 node24 pinned
        with:
          dotnet-version: 10.0.401

      - name: Build Engineering LAB userspace bundle
        if: ${{ inputs.phase == 'runtime' }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          .\build_lab.cmd
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $lab=Get-ChildItem .\release -Directory -Filter 'RansomGuard-Lab-v*' | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if(-not $lab){throw 'Engineering LAB release directory not found.'}
          "RG_LAB_RELEASE=$($lab.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and sign exact-commit runtime driver package
        if: ${{ inputs.phase == 'runtime' }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $package=Join-Path $env:RUNNER_TEMP 'ransomguard-verifier-driver'
          .\minifilter-tools\prepare_runtime_driver_package.ps1 -CertificateThumbprint $env:RANSOMGUARD_LAB_CERT_THUMBPRINT -OutputDirectory $package
          $provenance=Get-Content -LiteralPath (Join-Path $package 'runtime-package.json') -Raw | ConvertFrom-Json
          if([int]$provenance.schema -ne 2){throw "Runtime package provenance schema must be 2. Found '$($provenance.schema)'."}
          if($provenance.commit -ne $env:RG_WORKFLOW_SHA){throw "Runtime driver provenance commit '$($provenance.commit)' does not match workflow commit '$env:RG_WORKFLOW_SHA'."}
          $expectedThumb=$env:RANSOMGUARD_LAB_CERT_THUMBPRINT.Replace(' ','').ToUpperInvariant()
          if([string]$provenance.certificateThumbprint -ne $expectedThumb){throw "Runtime package certificate thumbprint '$($provenance.certificateThumbprint)' does not match configured LAB certificate '$expectedThumb'."}
          foreach($artifact in @(
            @('sysSha256',(Join-Path $package 'RansomGuardMinifilter.sys')),
            @('infSha256',(Join-Path $package 'RansomGuardMinifilter.inf')),
            @('catSha256',(Join-Path $package 'RansomGuardMinifilter.cat'))
          )){
            $expected=[string]$provenance.($artifact[0])
            $actual=(Get-FileHash -LiteralPath $artifact[1] -Algorithm SHA256).Hash
            if(-not [string]::Equals($expected,$actual,[StringComparison]::OrdinalIgnoreCase)){throw "Runtime package artifact hash mismatch for $($artifact[1])."}
          }
          "RG_DRIVER_PACKAGE=$package" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: ARM standard one-boot Driver Verifier
        if: ${{ inputs.phase == 'arm' }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $results=Join-Path $env:RUNNER_TEMP 'ransomguard-driver-verifier-arm-results'
          if(Test-Path -LiteralPath $results){Remove-Item -LiteralPath $results -Recurse -Force}
          New-Item -ItemType Directory -Path $results -Force | Out-Null
          .\minifilter-tools\arm_driver_verifier_lab.ps1 -RootBase $env:RG_VERIFIER_ROOT_BASE -ResultsDirectory $results
          $summary=Get-Content -LiteralPath (Join-Path $results 'driver-verifier-arm-result.json') -Raw | ConvertFrom-Json
          foreach($name in @(
            'cleanVerifierState','targetOnlyConfigured','standardFlagsConfigured',
            'querySettingsConfirmed','oneBootCommandSucceeded','stateDurable',
            'rebootRequired','passed'
          )){
            if($summary.$name -ne $true){throw "Driver Verifier ARM invariant '$name' was not true."}
          }
          "RG_VERIFIER_ARM_RESULTS=$results" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run bounded stress under Driver Verifier and schedule reset
        if: ${{ inputs.phase == 'runtime' }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parallel=0
          if(-not [int]::TryParse($env:RG_VERIFIER_PARALLELISM,[ref]$parallel) -or $parallel -lt 9 -or $parallel -gt 32){
            throw "parallelism must be an integer between 9 and 32. Found '$env:RG_VERIFIER_PARALLELISM'."
          }
          $results=Join-Path $env:RUNNER_TEMP 'ransomguard-driver-verifier-runtime-results'
          if(Test-Path -LiteralPath $results){Remove-Item -LiteralPath $results -Recurse -Force}
          New-Item -ItemType Directory -Path $results -Force | Out-Null
          .\minifilter-tools\run_driver_verifier_lab.ps1 -LabReleaseDirectory $env:RG_LAB_RELEASE -DriverPackageDirectory $env:RG_DRIVER_PACKAGE -RootBase $env:RG_VERIFIER_ROOT_BASE -StressRootBase $env:RG_VERIFIER_STRESS_ROOT_BASE -ResultsDirectory $results -Parallelism $parallel
          $summary=Get-Content -LiteralPath (Join-Path $results 'driver-verifier-runtime-result.json') -Raw | ConvertFrom-Json
          foreach($name in @(
            'bootChanged','armStandardSettingsBound','verifierObservedTargetLoaded',
            'noBugcheckBeforeStress','stressPassed','noBugcheckAfterStress',
            'resetCommandSucceeded','persistentSettingsCleared','resetStateDurable',
            'rebootRequired','passed'
          )){
            if($summary.$name -ne $true){throw "Driver Verifier runtime invariant '$name' was not true."}
          }
          "RG_VERIFIER_RUNTIME_RESULTS=$results" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prove Driver Verifier is clear after reset reboot
        if: ${{ inputs.phase == 'clear' }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $results=Join-Path $env:RUNNER_TEMP 'ransomguard-driver-verifier-clear-results'
          if(Test-Path -LiteralPath $results){Remove-Item -LiteralPath $results -Recurse -Force}
          New-Item -ItemType Directory -Path $results -Force | Out-Null
          .\minifilter-tools\verify_driver_verifier_clear_lab.ps1 -RootBase $env:RG_VERIFIER_ROOT_BASE -ResultsDirectory $results
          $summary=Get-Content -LiteralPath (Join-Path $results 'driver-verifier-clear-result.json') -Raw | ConvertFrom-Json
          foreach($name in @(
            'bootChanged','persistentSettingsAbsent','querySettingsClear',
            'currentActivityClear','filterNotLoaded','activeCampaignArchived','passed'
          )){
            if($summary.$name -ne $true){throw "Driver Verifier CLEAR invariant '$name' was not true."}
          }
          "RG_VERIFIER_CLEAR_RESULTS=$results" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: ARM reboot handoff
        if: ${{ success() && inputs.phase == 'arm' }}
        shell: pwsh
        run: |
          Write-Warning 'ARM PASSED. Reboot the disposable VM now. Driver Verifier is targeted only at RansomGuardMinifilter.sys and bootmode=oneboot. After Windows returns, restart the self-hosted runner elevated and launch a NEW workflow with phase=runtime on the exact same commit.'

      - name: Runtime reset reboot handoff
        if: ${{ success() && inputs.phase == 'runtime' }}
        shell: pwsh
        run: |
          Write-Warning 'VERIFIER RUNTIME PASSED and verifier /reset succeeded. Reboot the disposable VM once more. After Windows returns, restart the self-hosted runner elevated and launch a NEW workflow with phase=clear on the exact same commit.'

      - name: Ensure LAB minifilter is unloaded after runtime/clear
        if: ${{ always() && inputs.phase != 'arm' }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $filters=(& fltmc filters 2>$null | Out-String)
          if($LASTEXITCODE -ne 0){throw "Unable to query Filter Manager during Driver Verifier final cleanup, exit=$LASTEXITCODE"}
          if($filters -match '(?m)^\s*RansomGuardMinifilter\b'){
            $root=[IO.Path]::GetFullPath($env:RG_VERIFIER_STRESS_ROOT_BASE)
            $volume=[IO.Path]::GetPathRoot($root).TrimEnd('\')
            .\minifilter-tools\unload_minifilter_lab.ps1 -Volume $volume
          }

      - name: Upload Driver Verifier ARM evidence
        if: ${{ always() && inputs.phase == 'arm' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 node24 pinned
        with:
          name: ransomguard-driver-verifier-arm-evidence
          path: ${{ runner.temp }}/ransomguard-driver-verifier-arm-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Driver Verifier runtime evidence
        if: ${{ always() && inputs.phase == 'runtime' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 node24 pinned
        with:
          name: ransomguard-driver-verifier-runtime-evidence
          path: ${{ runner.temp }}/ransomguard-driver-verifier-runtime-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Driver Verifier CLEAR evidence
        if: ${{ always() && inputs.phase == 'clear' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 node24 pinned
        with:
          name: ransomguard-driver-verifier-clear-evidence
          path: ${{ runner.temp }}/ransomguard-driver-verifier-clear-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: Remove signed lab package
        if: ${{ always() && inputs.phase == 'runtime' }}
        shell: pwsh
        run: |
          if($env:RG_DRIVER_PACKAGE -and (Test-Path -LiteralPath $env:RG_DRIVER_PACKAGE)){
            Remove-Item -LiteralPath $env:RG_DRIVER_PACKAGE -Recurse -Force -ErrorAction SilentlyContinue
          }
