name: RansomGuard production containment reboot recovery VM qualification

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Multi-reboot production containment recovery phase.
        required: true
        type: choice
        options:
          - arm
          - resume
          - verify
      expected_sha:
        description: Exact source SHA to qualify.
        required: true
        type: string
      root_base:
        description: Persistent disposable VM campaign root. Must contain RansomGuard.
        required: true
        default: C:\RansomGuard-VM-ProductionContainmentRebootRecovery
        type: string

permissions:
  contents: read

concurrency:
  group: ransomguard-production-containment-reboot-recovery-vm
  cancel-in-progress: false

jobs:
  recovery:
    environment: ransomguard-lab-vm
    runs-on: [self-hosted, Windows, X64, ransomguard-lab-vm]
    timeout-minutes: 60
    env:
      RANSOMGUARD_LAB_VM: I_UNDERSTAND
      RANSOMGUARD_LAB_CERT_THUMBPRINT: ${{ secrets.RANSOMGUARD_LAB_CERT_THUMBPRINT }}
      RG_PHASE: ${{ inputs.phase }}
      RG_EXPECTED_SHA: ${{ inputs.expected_sha }}
      RG_ROOT_BASE: ${{ inputs.root_base }}

    steps:
      - name: Checkout exact qualification source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24 pinned
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1

      - name: Checkout protected-main orchestration policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24 pinned
        with:
          ref: main
          path: orchestrator
          fetch-depth: 1

      - name: Verify exact source and containment reboot-recovery gates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $actual=(git rev-parse HEAD).Trim()
          if(-not [string]::Equals($actual,$env:RG_EXPECTED_SHA,[StringComparison]::OrdinalIgnoreCase)){
            throw "Exact checkout mismatch. expected=$env:RG_EXPECTED_SHA actual=$actual"
          }
          if($env:RG_PHASE -notin @('arm','resume','verify')){throw "Invalid recovery phase '$env:RG_PHASE'."}
          if([string]::IsNullOrWhiteSpace($env:RANSOMGUARD_LAB_CERT_THUMBPRINT)){
            throw 'Environment secret RANSOMGUARD_LAB_CERT_THUMBPRINT is required.'
          }
          $root=[IO.Path]::GetFullPath($env:RG_ROOT_BASE)
          if($root -notmatch '(?i)RansomGuard'){throw 'root_base must contain RansomGuard.'}
          if($root -eq [IO.Path]::GetPathRoot($root).TrimEnd('\')){throw 'root_base cannot be an entire drive.'}

          Push-Location .\orchestrator
          try{
            .\tools\verify_powershell_automation.ps1
            .\tools\verify_supply_chain.ps1
            .\tools\verify_threat_model.ps1
            .\tools\verify_production_containment_reboot_recovery_harness.ps1 -RepositoryRoot $PWD
          }finally{Pop-Location}

          .\tools\verify_powershell_automation.ps1
          .\tools\verify_supply_chain.ps1
          .\tools\verify_threat_model.ps1
          .\tools\verify_production_containment_reboot_recovery_harness.ps1 -RepositoryRoot $PWD

      - name: Verify disposable VM runner readiness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          .\minifilter-tools\verify_runtime_runner_readiness.ps1 -CertificateThumbprint $env:RANSOMGUARD_LAB_CERT_THUMBPRINT
          $filters=(& fltmc filters 2>$null | Out-String)
          if($LASTEXITCODE -ne 0){throw 'Unable to query Filter Manager.'}
          if($filters -match '(?m)^\s*RansomGuardMinifilter\b'){
            throw "REFUSED: RansomGuardMinifilter is loaded at phase '$env:RG_PHASE' entry. Revert/clean the disposable VM snapshot."
          }

      - name: Setup .NET 10 for ARM
        if: ${{ inputs.phase == 'arm' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0 node24 pinned
        with:
          dotnet-version: 10.0.401

      - name: Build and stage persistent exact-source campaign package
        if: ${{ inputs.phase == 'arm' }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $active=Join-Path ([IO.Path]::GetFullPath($env:RG_ROOT_BASE)) 'Active'
          $state=Join-Path $active 'containment-reboot-recovery-campaign.json'
          if(Test-Path -LiteralPath $state){throw 'A reboot-recovery campaign state already exists. Finish the campaign or revert the disposable VM.'}
          if(Test-Path -LiteralPath $active){Remove-Item -LiteralPath $active -Recurse -Force}
          New-Item -ItemType Directory -Path $active -Force | Out-Null

          .\build_lab.cmd
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

          $lab=Get-ChildItem .\release -Directory -Filter 'RansomGuard-Lab-v*' | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          $normal=Get-ChildItem .\release -Directory -Filter 'RansomGuard-v*' | Where-Object { $_.Name -notlike 'RansomGuard-Lab-v*' } | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if(-not $lab){throw 'Engineering LAB release directory not found.'}
          if(-not $normal){throw 'Normal release directory not found.'}

          $driverPackage=Join-Path $env:RUNNER_TEMP 'ransomguard-containment-reboot-recovery-driver'
          if(Test-Path -LiteralPath $driverPackage){Remove-Item -LiteralPath $driverPackage -Recurse -Force}
          .\minifilter-tools\prepare_runtime_driver_package.ps1 -CertificateThumbprint $env:RANSOMGUARD_LAB_CERT_THUMBPRINT -OutputDirectory $driverPackage
          $driverProvenance=Get-Content -LiteralPath (Join-Path $driverPackage 'runtime-package.json') -Raw | ConvertFrom-Json
          if([int]$driverProvenance.schema -ne 2 -or
             -not [string]::Equals([string]$driverProvenance.commit,$env:RG_EXPECTED_SHA,[StringComparison]::OrdinalIgnoreCase)){
            throw 'Runtime driver package provenance does not bind to the exact requested SHA.'
          }

          $qualification=Join-Path $active 'qualification'
          .\minifilter-tools\prepare_production_lifecycle_qualification_package.ps1 -NormalReleaseDirectory $normal.FullName -LabReleaseDirectory $lab.FullName -DriverPackageDirectory $driverPackage -CertificateThumbprint $env:RANSOMGUARD_LAB_CERT_THUMBPRINT -OutputDirectory $qualification
          $summary=Get-Content -LiteralPath (Join-Path $qualification 'qualification-package.json') -Raw | ConvertFrom-Json
          if([int]$summary.schema -ne 1 -or $summary.qualificationOnly -ne $true -or
             -not [string]::Equals([string]$summary.commit,$env:RG_EXPECTED_SHA,[StringComparison]::OrdinalIgnoreCase)){
            throw 'Persistent production qualification package provenance is invalid.'
          }

          $fixtureProject='.\qualification\RansomGuard.ProductionContainmentE2EFixture\RansomGuard.ProductionContainmentE2EFixture.csproj'
          dotnet restore $fixtureProject --locked-mode -r win-x64
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $fixtureOut=Join-Path $active 'fixture'
          dotnet publish $fixtureProject -c Release -r win-x64 --self-contained true --no-restore -o $fixtureOut
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $fixture=Join-Path $fixtureOut 'RansomGuard.ProductionContainmentE2EFixture.exe'
          if(-not(Test-Path -LiteralPath $fixture -PathType Leaf)){throw 'Persistent containment fixture was not published.'}

          Remove-Item -LiteralPath $driverPackage -Recurse -Force -ErrorAction SilentlyContinue

      - name: Execute containment reboot-recovery phase
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          .\minifilter-tools\run_production_containment_reboot_recovery_lab.ps1 -Phase $env:RG_PHASE -ExpectedCommit $env:RG_EXPECTED_SHA -RootBase $env:RG_ROOT_BASE

      - name: Upload phase evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 node24 pinned
        with:
          name: ransomguard-production-containment-reboot-recovery-${{ inputs.phase }}-${{ inputs.expected_sha }}
          path: ${{ inputs.root_base }}\Evidence\${{ inputs.expected_sha }}\**
          if-no-files-found: warn
          retention-days: 30

      - name: Schedule first or second campaign reboot
        if: ${{ success() && (inputs.phase == 'arm' || inputs.phase == 'resume') }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & "$env:SystemRoot\System32\shutdown.exe" /r /t 60 /f /d p:4:1 /c "RansomGuard production containment reboot-recovery qualification"
          if($LASTEXITCODE -ne 0){throw "Unable to schedule disposable VM reboot. exit=$LASTEXITCODE"}
          Write-Warning "Containment reboot-recovery phase '$env:RG_PHASE' passed; VM reboot is scheduled in 60 seconds."
