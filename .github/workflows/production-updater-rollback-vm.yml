name: RansomGuard production updater rollback VM qualification

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact source SHA to qualify for transactional service update and rollback.
        required: true
        type: string
      root_base:
        description: Disposable VM-only data root. Must contain RansomGuard.
        required: true
        default: C:\RansomGuard-VM-UpdaterRollback
        type: string

permissions:
  contents: read

concurrency:
  group: ransomguard-production-updater-rollback-vm
  cancel-in-progress: false

jobs:
  updater:
    environment: ransomguard-lab-vm
    runs-on: [self-hosted, Windows, X64, ransomguard-lab-vm]
    timeout-minutes: 50
    env:
      RANSOMGUARD_LAB_VM: I_UNDERSTAND
      RG_EXPECTED_SHA: ${{ inputs.expected_sha }}
      RG_ROOT_BASE: ${{ inputs.root_base }}

    steps:
      - name: Checkout exact qualification source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24 pinned
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1

      - name: Checkout protected-main orchestration policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24 pinned
        with:
          ref: main
          path: orchestrator
          fetch-depth: 1

      - name: Verify exact source and updater qualification gates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $actual=(git rev-parse HEAD).Trim()
          if(-not [string]::Equals($actual,$env:RG_EXPECTED_SHA,[StringComparison]::OrdinalIgnoreCase)){
            throw "Exact checkout mismatch. expected=$env:RG_EXPECTED_SHA actual=$actual"
          }
          .\orchestrator\tools\verify_production_updater_vm_harness.ps1 -RepositoryRoot $PWD

      - name: Verify disposable VM runner readiness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $cs=Get-CimInstance Win32_ComputerSystem
          $vm="$($cs.Manufacturer) $($cs.Model)"
          if($vm -notmatch '(?i)virtual|vmware|virtualbox|kvm|qemu|hyper-v|parallels|xen'){
            throw "REFUSED: updater qualification requires a disposable VM. Detected: $vm"
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0 node24 pinned
        with:
          dotnet-version: 10.0.401

      - name: Build old and current updater qualification packages
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base=Join-Path $env:RUNNER_TEMP ("ransomguard-updater-"+$env:GITHUB_RUN_ID+"-"+$env:GITHUB_RUN_ATTEMPT)
          $old=Join-Path $base 'old'
          $current=Join-Path $base 'current'
          $failure=Join-Path $base 'failure'
          foreach($p in @($old,$current,$failure)){New-Item -ItemType Directory -Path $p -Force | Out-Null}

          dotnet publish .\src\RansomGuard.Service\RansomGuard.Service.csproj -c Release -r win-x64 --self-contained true --locked-mode -p:Version=0.8.6.0 -p:BaseIntermediateOutputPath=obj-updater-old\ -p:BaseOutputPath=bin-updater-old\ -o (Join-Path $old 'package')
          if($LASTEXITCODE -ne 0){throw 'Old service publish failed.'}
          dotnet publish .\qualification\RansomGuard.UpdaterQualification\RansomGuard.UpdaterQualification.csproj -c Release -r win-x64 --self-contained true --locked-mode -p:Version=0.8.6.0 -p:BaseIntermediateOutputPath=obj-updater-old\ -p:BaseOutputPath=bin-updater-old\ -o (Join-Path $old 'helper')
          if($LASTEXITCODE -ne 0){throw 'Old administration helper publish failed.'}

          dotnet publish .\src\RansomGuard.Service\RansomGuard.Service.csproj -c Release -r win-x64 --self-contained true --locked-mode -p:BaseIntermediateOutputPath=obj-updater-current\ -p:BaseOutputPath=bin-updater-current\ -o (Join-Path $current 'package')
          if($LASTEXITCODE -ne 0){throw 'Current service publish failed.'}
          dotnet publish .\qualification\RansomGuard.UpdaterQualification\RansomGuard.UpdaterQualification.csproj -c Release -r win-x64 --self-contained true --locked-mode -p:BaseIntermediateOutputPath=obj-updater-current\ -p:BaseOutputPath=bin-updater-current\ -o (Join-Path $current 'helper')
          if($LASTEXITCODE -ne 0){throw 'Current administration helper publish failed.'}

          dotnet publish .\qualification\RansomGuard.UpdaterFailureFixture\RansomGuard.UpdaterFailureFixture.csproj -c Release -r win-x64 --self-contained true --locked-mode -p:BaseIntermediateOutputPath=obj-updater-failure\ -p:BaseOutputPath=bin-updater-failure\ -o $failure
          if($LASTEXITCODE -ne 0){throw 'Failure fixture publish failed.'}

          $oldService=Join-Path $old 'package\RansomGuard.Service.exe'
          $currentService=Join-Path $current 'package\RansomGuard.Service.exe'
          $badService=Join-Path $failure 'RansomGuard.Service.exe'
          $oldVersion=[Diagnostics.FileVersionInfo]::GetVersionInfo($oldService).FileVersion
          $currentVersion=[Diagnostics.FileVersionInfo]::GetVersionInfo($currentService).FileVersion
          $badVersion=[Diagnostics.FileVersionInfo]::GetVersionInfo($badService).FileVersion
          if($oldVersion -ne '0.8.6.0'){throw "Unexpected old fixture version: $oldVersion"}
          $parsed=$null
          if(-not [Version]::TryParse($currentVersion,[ref]$parsed)){throw "Invalid current version: $currentVersion"}
          if(([Version]$currentVersion) -le ([Version]$oldVersion)){throw "Current version is not forward of old fixture. old=$oldVersion current=$currentVersion"}
          if($badVersion -ne $currentVersion){throw "Failure fixture version mismatch. bad=$badVersion current=$currentVersion"}

          "old_package=$(Join-Path $old 'package')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "old_helper=$(Join-Path $old 'helper\RansomGuard.UpdaterQualification.exe')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "current_package=$(Join-Path $current 'package')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "current_helper=$(Join-Path $current 'helper\RansomGuard.UpdaterQualification.exe')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "failure_package=$failure" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run transactional updater and deterministic rollback qualification
        shell: pwsh
        env:
          RG_OLD_PACKAGE: ${{ steps.build.outputs.old_package }}
          RG_OLD_HELPER: ${{ steps.build.outputs.old_helper }}
          RG_CURRENT_PACKAGE: ${{ steps.build.outputs.current_package }}
          RG_CURRENT_HELPER: ${{ steps.build.outputs.current_helper }}
          RG_FAILURE_PACKAGE: ${{ steps.build.outputs.failure_package }}
        run: |
          $ErrorActionPreference='Stop'
          $results=Join-Path $env:RUNNER_TEMP ("ransomguard-production-updater-rollback-evidence-"+$env:GITHUB_RUN_ID+"-"+$env:GITHUB_RUN_ATTEMPT)
          .\qualification\run_production_updater_rollback_vm.ps1 -OldAdminHelper $env:RG_OLD_HELPER -CurrentAdminHelper $env:RG_CURRENT_HELPER -OldPackage $env:RG_OLD_PACKAGE -CurrentPackage $env:RG_CURRENT_PACKAGE -FailurePackage $env:RG_FAILURE_PACKAGE -ExpectedCommit $env:RG_EXPECTED_SHA -RootBase $env:RG_ROOT_BASE -ResultsDirectory $results
          $summary=Get-Content -LiteralPath (Join-Path $results 'production-updater-rollback-result.json') -Raw | ConvertFrom-Json
          foreach($name in @(
            'initialServiceAbsent','oldInstallForSuccess','tamperedExpectedHashRejected',
            'forwardReviewPassed','forwardUpdateCompleted','forwardTargetSelected',
            'sameVersionReplayRejected','firstUninstallPassed','oldInstallForRollback',
            'postCommitFailureObserved','previousImageRestored','rollbackJournalTerminal',
            'completedJournalTerminal','completionAuditObserved','rollbackAuditObserved',
            'finalUninstallPassed','cleanupPassed','passed'
          )){
            if($summary.$name -ne $true){throw "Updater qualification invariant '$name' was not true."}
          }
          "RG_UPDATER_RESULTS=$results" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ensure service registration cleanup
        if: always()
        shell: pwsh
        env:
          RG_CURRENT_HELPER: ${{ steps.build.outputs.current_helper }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:RG_CURRENT_HELPER -and (Test-Path -LiteralPath $env:RG_CURRENT_HELPER -PathType Leaf)){
            & $env:RG_CURRENT_HELPER uninstall
            if($LASTEXITCODE -ne 0){throw 'Updater qualification cleanup could not unregister RansomGuardV03.'}
          }

      - name: Upload updater rollback evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 node24 pinned
        with:
          name: ransomguard-production-updater-rollback-${{ inputs.expected_sha }}
          path: ${{ env.RG_UPDATER_RESULTS }}/**
          if-no-files-found: warn
          retention-days: 30
