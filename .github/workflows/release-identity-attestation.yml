name: Release identity attestation

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Protected release tag identity (vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N)
        required: true
        type: string
      source_sha:
        description: Exact protected-main source SHA to attest
        required: true
        type: string
      windows_build_run_id:
        description: Successful main/push Windows build run for the same source SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write

concurrency:
  group: release-identity-attestation-${{ inputs.tag_name }}-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  attest:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24 pinned
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Checkout exact protected-main attestation policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24 pinned
        with:
          ref: ${{ github.sha }}
          path: orchestrator
          fetch-depth: 1

      - name: Audit repository security gates
        shell: pwsh
        run: |
          Push-Location .\orchestrator
          try {
            .\tools\verify_powershell_automation.ps1
            .\tools\verify_supply_chain.ps1
            .\tools\verify_threat_model.ps1
          }
          finally {
            Pop-Location
          }

          .\tools\verify_powershell_automation.ps1
          .\tools\verify_supply_chain.ps1
          .\tools\verify_threat_model.ps1

      - name: Verify exact protected-main identity and tag rulesets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag_name }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          $ErrorActionPreference='Stop'

          if($env:SOURCE_SHA -notmatch '^[0-9a-fA-F]{40}$'){
            throw 'source_sha must be a full 40-character Git SHA.'
          }
          if(-not [string]::Equals($env:WORKFLOW_REF,'refs/heads/main',[StringComparison]::Ordinal)){
            throw "Release identity attestation must be dispatched from protected main. ref=$env:WORKFLOW_REF"
          }
          $compareRaw=gh api "repos/$env:GH_REPO/compare/$env:SOURCE_SHA...$env:WORKFLOW_SHA"
          if($LASTEXITCODE -ne 0){throw 'Unable to verify release-source ancestry against attestation workflow SHA.'}
          $compare=$compareRaw | ConvertFrom-Json
          if([int]$compare.behind_by -ne 0 -or
             ([string]$compare.status -ne 'ahead' -and [string]$compare.status -ne 'identical')){
            throw "Attestation workflow SHA must be the exact release source or a protected-main descendant. status=$($compare.status) ahead=$($compare.ahead_by) behind=$($compare.behind_by)"
          }

          $actual=(git rev-parse HEAD).Trim()
          if(-not [string]::Equals($actual,$env:SOURCE_SHA,[StringComparison]::OrdinalIgnoreCase)){
            throw "Exact checkout mismatch. actual=$actual source=$env:SOURCE_SHA"
          }

          New-Item -ItemType Directory -Force -Path .\build-logs\release-identity | Out-Null
          .\tools\verify_release_identity_preflight.ps1 `
            -RepositoryRoot $PWD `
            -TagName $env:RELEASE_TAG `
            -SourceSha $env:SOURCE_SHA `
            -OutputPath .\build-logs\release-identity\release-identity-preflight.json

          $summaryRaw = gh api "repos/$env:GH_REPO/rulesets"
          if($LASTEXITCODE -ne 0){throw 'Unable to read repository rulesets.'}
          $summary=@($summaryRaw | ConvertFrom-Json)
          $details=@()
          foreach($item in $summary){
            $raw=gh api "repos/$env:GH_REPO/rulesets/$($item.id)"
            if($LASTEXITCODE -ne 0){throw "Unable to read repository ruleset $($item.id)."}
            $details += ($raw | ConvertFrom-Json)
          }
          $rulesetsPath=Join-Path $PWD 'build-logs\release-identity\repository-rulesets.json'
          $details | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $rulesetsPath -Encoding utf8NoBOM
          .\orchestrator\tools\verify_release_tag_rulesets.ps1 -RulesetsJsonPath $rulesetsPath -TagName $env:RELEASE_TAG -AllowRedactedBypassActors

          git fetch origin "refs/tags/$env:RELEASE_TAG:refs/tags/$env:RELEASE_TAG" --no-tags
          if($LASTEXITCODE -ne 0){throw "Release tag '$env:RELEASE_TAG' does not exist on origin."}

          $tagType=(git cat-file -t "refs/tags/$env:RELEASE_TAG").Trim()
          if($LASTEXITCODE -ne 0 -or $tagType -ne 'tag'){
            throw "Release tag '$env:RELEASE_TAG' must be an annotated tag object."
          }

          $tagObjectSha=(git rev-parse "refs/tags/$env:RELEASE_TAG").Trim().ToLowerInvariant()
          $tagCommitSha=(git rev-parse "$env:RELEASE_TAG^{commit}").Trim().ToLowerInvariant()
          if($LASTEXITCODE -ne 0 -or
             -not [string]::Equals($tagCommitSha,$env:SOURCE_SHA,[StringComparison]::OrdinalIgnoreCase)){
            throw "Release tag '$env:RELEASE_TAG' does not resolve to exact source '$env:SOURCE_SHA'. actual=$tagCommitSha"
          }
          "RG_TAG_OBJECT_SHA=$tagObjectSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RG_ATTESTATION_WORKFLOW_SHA=$($env:WORKFLOW_SHA.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RG_ATTESTATION_WORKFLOW_REF=$env:WORKFLOW_REF" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify and download exact Windows build artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.tag_name }}
          WINDOWS_BUILD_RUN_ID: ${{ inputs.windows_build_run_id }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:WINDOWS_BUILD_RUN_ID -notmatch '^[1-9][0-9]*$'){
            throw 'windows_build_run_id must be a positive numeric Actions run id.'
          }

          $runRaw=gh api "repos/$env:GH_REPO/actions/runs/$env:WINDOWS_BUILD_RUN_ID"
          if($LASTEXITCODE -ne 0){throw 'Unable to read Windows build run.'}
          $run=$runRaw | ConvertFrom-Json
          if([string]$run.name -ne 'Windows build' -or
             [string]$run.conclusion -ne 'success' -or
             [string]$run.event -ne 'push' -or
             [string]$run.head_branch -ne 'main' -or
             -not [string]::Equals([string]$run.head_sha,$env:SOURCE_SHA,[StringComparison]::OrdinalIgnoreCase)){
            throw "Windows build run is not a successful main/push build of the exact release source. name=$($run.name) conclusion=$($run.conclusion) event=$($run.event) branch=$($run.head_branch) sha=$($run.head_sha)"
          }

          $root=Join-Path $PWD 'attestation-input'
          $windows=Join-Path $root 'windows'
          $governance=Join-Path $root 'governance'
          New-Item -ItemType Directory -Force -Path $windows,$governance | Out-Null

          gh run download $env:WINDOWS_BUILD_RUN_ID --repo $env:GH_REPO --name ransomguard-windows --dir $windows
          if($LASTEXITCODE -ne 0){throw 'Unable to download ransomguard-windows artifact.'}
          gh run download $env:WINDOWS_BUILD_RUN_ID --repo $env:GH_REPO --name ransomguard-release-governance --dir $governance
          if($LASTEXITCODE -ne 0){throw 'Unable to download ransomguard-release-governance artifact.'}

          $inventoryPath=(Get-ChildItem -LiteralPath $governance -Recurse -File -Filter 'release-artifact-inventory.json')
          if(@($inventoryPath).Count -ne 1){throw 'Expected exactly one release-artifact-inventory.json.'}
          $inventory=Get-Content -Raw -LiteralPath $inventoryPath.FullName | ConvertFrom-Json -Depth 100
          if(-not [string]::Equals([string]$inventory.sourceSha,$env:SOURCE_SHA,[StringComparison]::OrdinalIgnoreCase)){
            throw "Release inventory source SHA mismatch: $($inventory.sourceSha)"
          }

          $downloaded=@(Get-ChildItem -LiteralPath $windows -Recurse -File)
          if($downloaded.Count -ne @($inventory.files).Count){
            throw "Downloaded release file count does not match governance inventory. downloaded=$($downloaded.Count) inventory=$(@($inventory.files).Count)"
          }

          foreach($item in @($inventory.files)){
            $matches=@($downloaded | Where-Object { $_.Name -eq [IO.Path]::GetFileName([string]$item.path) })
            if($matches.Count -ne 1){throw "Unable to map governed artifact '$($item.path)' to exactly one downloaded file."}
            $file=$matches[0]
            if([long]$file.Length -ne [long]$item.length){throw "Length mismatch for $($item.path)."}
            $sha=(Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash
            if(-not [string]::Equals($sha,[string]$item.sha256,[StringComparison]::OrdinalIgnoreCase)){
              throw "SHA-256 mismatch for $($item.path)."
            }
          }

          $sums=(Get-ChildItem -LiteralPath $governance -Recurse -File -Filter 'SHA256SUMS.txt')
          if(@($sums).Count -ne 1){throw 'Expected exactly one SHA256SUMS.txt.'}
          $sbom=(Get-ChildItem -LiteralPath $governance -Recurse -File -Filter 'ransomguard.spdx.json')
          if(@($sbom).Count -ne 1){throw 'Expected exactly one ransomguard.spdx.json.'}

          $rulesetsPath=Join-Path $PWD 'build-logs\release-identity\repository-rulesets.json'
          $preflightPath=Join-Path $PWD 'build-logs\release-identity\release-identity-preflight.json'
          $identity=[ordered]@{
            schema=1
            product='RansomGuard'
            tagName=$env:RELEASE_TAG
            sourceSha=$env:SOURCE_SHA.ToLowerInvariant()
            tagObjectSha=$env:RG_TAG_OBJECT_SHA
            attestationWorkflowSha=$env:RG_ATTESTATION_WORKFLOW_SHA
            attestationWorkflowRef=$env:RG_ATTESTATION_WORKFLOW_REF
            windowsBuildRunId=[long]$env:WINDOWS_BUILD_RUN_ID
            windowsBuildRunUrl="https://github.com/$env:GH_REPO/actions/runs/$env:WINDOWS_BUILD_RUN_ID"
            artifactInventory=@($inventory.files)
            artifactInventorySha256=(Get-FileHash -Algorithm SHA256 -LiteralPath $inventoryPath.FullName).Hash
            sha256SumsSha256=(Get-FileHash -Algorithm SHA256 -LiteralPath $sums.FullName).Hash
            sbomSha256=(Get-FileHash -Algorithm SHA256 -LiteralPath $sbom.FullName).Hash
            tagRulesetEvidenceSha256=(Get-FileHash -Algorithm SHA256 -LiteralPath $rulesetsPath).Hash
            preflightSha256=(Get-FileHash -Algorithm SHA256 -LiteralPath $preflightPath).Hash
            generatedUtc=[DateTime]::UtcNow.ToString('o')
            note='GitHub/Sigstore attestation workflow binds this immutable annotated tag, exact release source, governed Windows artifact bytes, and protected-main attestation workflow SHA. The workflow does not create or move a Git tag.'
          }
          $identityPath=Join-Path $PWD 'build-logs\release-identity\release-identity.json'
          $identity | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $identityPath -Encoding utf8NoBOM

          Copy-Item -LiteralPath $sums.FullName -Destination (Join-Path $PWD 'build-logs\release-identity\SHA256SUMS.txt') -Force
          Copy-Item -LiteralPath $inventoryPath.FullName -Destination (Join-Path $PWD 'build-logs\release-identity\release-artifact-inventory.json') -Force
          Copy-Item -LiteralPath $sbom.FullName -Destination (Join-Path $PWD 'build-logs\release-identity\ransomguard.spdx.json') -Force

      - name: Attest exact release artifact checksums
        id: attest_artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 pinned
        with:
          subject-checksums: build-logs/release-identity/SHA256SUMS.txt

      - name: Attest release identity manifest
        id: attest_identity
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 pinned
        with:
          subject-path: build-logs/release-identity/release-identity.json

      - name: Preserve Sigstore bundles
        shell: pwsh
        env:
          ARTIFACT_BUNDLE: ${{ steps.attest_artifacts.outputs.bundle-path }}
          IDENTITY_BUNDLE: ${{ steps.attest_identity.outputs.bundle-path }}
        run: |
          $ErrorActionPreference='Stop'
          foreach($entry in @(
            @{Source=$env:ARTIFACT_BUNDLE;Name='release-artifacts.sigstore.json'},
            @{Source=$env:IDENTITY_BUNDLE;Name='release-identity.sigstore.json'}
          )){
            if([string]::IsNullOrWhiteSpace([string]$entry.Source) -or -not(Test-Path -LiteralPath $entry.Source -PathType Leaf)){
              throw "Attestation bundle missing: $($entry.Name)"
            }
            Copy-Item -LiteralPath $entry.Source -Destination (Join-Path $PWD "build-logs\release-identity\$($entry.Name)") -Force
          }

      - name: Verify published attestations
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference='Stop'
          $files=@(Get-ChildItem -LiteralPath .\attestation-input\windows -Recurse -File)
          foreach($file in $files){
            gh attestation verify $file.FullName --repo $env:GH_REPO
            if($LASTEXITCODE -ne 0){throw "Published artifact attestation verification failed: $($file.Name)"}
          }
          gh attestation verify .\build-logs\release-identity\release-identity.json --repo $env:GH_REPO
          if($LASTEXITCODE -ne 0){throw 'Published release identity attestation verification failed.'}

      - name: Upload release identity attestation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 node24 pinned
        with:
          name: ransomguard-release-identity-${{ inputs.tag_name }}-${{ inputs.source_sha }}
          path: build-logs/release-identity/**
          if-no-files-found: error
          retention-days: 90
