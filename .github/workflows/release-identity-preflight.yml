name: Release identity preflight

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Proposed release tag (vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N)
        required: true
        type: string
      source_sha:
        description: Exact 40-character source SHA proposed for the release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-identity-preflight-${{ inputs.tag_name }}-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout policy source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24 pinned
        with:
          ref: main
          fetch-depth: 0

      - name: Audit repository security gates
        shell: pwsh
        run: |
          .\tools\verify_powershell_automation.ps1
          .\tools\verify_supply_chain.ps1
          .\tools\verify_threat_model.ps1

      - name: Checkout exact proposed release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24 pinned
        with:
          ref: ${{ inputs.source_sha }}
          path: candidate
          fetch-depth: 0

      - name: Verify release identity preflight
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:SOURCE_SHA -notmatch '^[0-9a-fA-F]{40}$') {
              throw 'source_sha must be a full 40-character Git SHA.'
          }

          & git -C .\candidate fetch origin main --no-tags
          if ($LASTEXITCODE -ne 0) {
              throw 'Unable to fetch origin/main for release ancestry proof.'
          }

          & git -C .\candidate merge-base --is-ancestor $env:SOURCE_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
              throw "Proposed release source '$env:SOURCE_SHA' is not reachable from protected main."
          }

          $out = Join-Path $PWD 'build-logs\release-identity\release-identity-preflight.json'
          .\tools\verify_release_identity_preflight.ps1 `
              -RepositoryRoot (Join-Path $PWD 'candidate') `
              -TagName $env:RELEASE_TAG `
              -SourceSha $env:SOURCE_SHA `
              -OutputPath $out

      - name: Upload release identity preflight evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 node24 pinned # v4 pinned
        with:
          name: ransomguard-release-identity-preflight-${{ inputs.tag_name }}-${{ inputs.source_sha }}
          path: build-logs/release-identity/**
          if-no-files-found: error
          retention-days: 90
