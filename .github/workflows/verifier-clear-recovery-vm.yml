name: RansomGuard Driver Verifier CLEAR recovery

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact frozen candidate SHA whose persisted verifier campaign is being cleared.
        required: true
        type: string

permissions:
  contents: read

jobs:
  clear-recovery:
    environment: ransomguard-lab-vm
    runs-on: [self-hosted, Windows, X64, ransomguard-lab-vm]
    timeout-minutes: 15
    env:
      RANSOMGUARD_LAB_VM: I_UNDERSTAND
      RG_EXPECTED_SHA: ${{ inputs.expected_sha }}
      RG_WORKFLOW_SHA: ${{ inputs.expected_sha }}
      RG_VERIFIER_ROOT_BASE: C:\RansomGuard-VM-Verifier

    steps:
      - name: Checkout policy source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24 pinned
        with:
          ref: main
          fetch-depth: 1

      - name: Verify threat-model policy
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          .\tools\verify_threat_model.ps1

      - name: Validate requested exact SHA
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RG_EXPECTED_SHA -notmatch '^[0-9a-fA-F]{40}$'){
            throw 'expected_sha must be exactly 40 hexadecimal characters.'
          }

      - name: Checkout exact frozen candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24 pinned
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1

      - name: Verify exact checkout and disposable VM
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest

          $actual=(git rev-parse HEAD).Trim()
          if(-not [string]::Equals($actual,$env:RG_EXPECTED_SHA,[StringComparison]::OrdinalIgnoreCase)){
            throw "Exact checkout mismatch. expected=$env:RG_EXPECTED_SHA actual=$actual"
          }

          $cs=Get-CimInstance Win32_ComputerSystem
          $vmText="$($cs.Manufacturer) $($cs.Model)"
          if($vmText -notmatch '(?i)virtual|vmware|virtualbox|kvm|qemu|hyper-v|parallels|xen'){
            throw "REFUSED: verifier CLEAR recovery requires an obvious disposable VM. Detected: $vmText"
          }
          if($env:RANSOMGUARD_LAB_VM -cne 'I_UNDERSTAND'){
            throw 'REFUSED: RANSOMGUARD_LAB_VM=I_UNDERSTAND is required.'
          }

          $script='minifilter-tools\verify_driver_verifier_clear_lab.ps1'
          if(-not(Test-Path -LiteralPath $script -PathType Leaf)){
            throw "Frozen candidate CLEAR verifier script is missing: $script"
          }

          Write-Host "Recovery CLEAR is bound to frozen candidate $actual."

      - name: Prove Driver Verifier clear state from frozen candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $results=Join-Path $env:RUNNER_TEMP 'ransomguard-driver-verifier-clear-recovery-results'
          if(Test-Path -LiteralPath $results){Remove-Item -LiteralPath $results -Recurse -Force}
          New-Item -ItemType Directory -Path $results -Force | Out-Null
          .\minifilter-tools\verify_driver_verifier_clear_lab.ps1 -RootBase $env:RG_VERIFIER_ROOT_BASE -ResultsDirectory $results

          $summary=Get-Content -LiteralPath (Join-Path $results 'driver-verifier-clear-result.json') -Raw | ConvertFrom-Json
          foreach($name in @(
            'bootChanged','persistentSettingsAbsent','querySettingsClear',
            'currentActivityClear','filterNotLoaded','activeCampaignArchived','passed'
          )){
            if($summary.$name -ne $true){
              throw "Driver Verifier CLEAR invariant '$name' was not true."
            }
          }

          [ordered]@{
            schema=1
            frozenCandidateSha=$env:RG_EXPECTED_SHA
            clearSummary=$summary
          } | ConvertTo-Json -Depth 30 | Set-Content -LiteralPath (Join-Path $results 'clear-recovery-attestation.json') -Encoding utf8

          "RG_CLEAR_RECOVERY_RESULTS=$results" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload CLEAR recovery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 node24 pinned
        with:
          name: ransomguard-driver-verifier-clear-recovery-evidence
          path: ${{ env.RG_CLEAR_RECOVERY_RESULTS }}/**
          if-no-files-found: warn
          retention-days: 14
