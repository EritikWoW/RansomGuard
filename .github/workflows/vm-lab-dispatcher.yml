name: RansomGuard VM lab dispatcher

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: read

jobs:
  dispatch-runtime-vm:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 59 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/run-runtime-vm ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout policy source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24 pinned
        with:
          ref: main

      - name: Verify threat-model policy
        shell: pwsh
        run: |
          .\tools\verify_threat_model.ps1

      - name: Parse and validate requested ref
        id: request
        shell: pwsh
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          $ErrorActionPreference = 'Stop'
          $body = [string]$env:COMMENT_BODY
          if ($body -notmatch '^/run-runtime-vm\s+([^\s]+)\s*$') {
            throw 'Expected exactly: /run-runtime-vm <ref>'
          }

          $ref = $Matches[1]
          if ($ref -ne 'main' -and -not $ref.StartsWith('feature/', [StringComparison]::Ordinal)) {
            throw "Ref '$ref' is not allowed. Allowed: main or feature/*."
          }

          if ($ref -match '\.\.' -or $ref -match '[~^:?*\[\\]') {
            throw "Ref '$ref' contains characters that are not allowed."
          }

          "ref=$ref" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify branch exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ steps.request.outputs.ref }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh api "repos/$env:GH_REPO/branches/$([uri]::EscapeDataString($env:TARGET_REF))" --silent

      - name: Dispatch minifilter runtime VM lab
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ steps.request.outputs.ref }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = @{
            ref = $env:TARGET_REF
            inputs = @{
              root_base = 'C:\RansomGuard-VM-Integration'
            }
          } | ConvertTo-Json -Depth 4 -Compress

          $payload | gh api --method POST -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "repos/$env:GH_REPO/actions/workflows/minifilter-runtime-vm.yml/dispatches" --input -

      - name: Record dispatch
        shell: pwsh
        env:
          TARGET_REF: ${{ steps.request.outputs.ref }}
        run: |
          Write-Host "Dispatched minifilter-runtime-vm.yml for ref '$env:TARGET_REF'."

  dispatch-verifier-vm:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 59 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/run-verifier-vm ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout policy source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24 pinned
        with:
          ref: main

      - name: Verify threat-model policy
        shell: pwsh
        run: |
          .\tools\verify_threat_model.ps1

      - name: Parse and validate verifier request
        id: request
        shell: pwsh
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          $ErrorActionPreference = 'Stop'
          $body = [string]$env:COMMENT_BODY
          if ($body -notmatch '^/run-verifier-vm\s+(arm|runtime|clear)\s+([^\s]+)\s*$') {
            throw 'Expected exactly: /run-verifier-vm <arm|runtime|clear> <ref>'
          }

          $phase = $Matches[1]
          $ref = $Matches[2]
          if ($ref -ne 'main' -and -not $ref.StartsWith('feature/', [StringComparison]::Ordinal)) {
            throw "Ref '$ref' is not allowed. Allowed: main or feature/*."
          }

          if ($ref -match '\.\.' -or $ref -match '[~^:?*\[\\]') {
            throw "Ref '$ref' contains characters that are not allowed."
          }

          "phase=$phase" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "ref=$ref" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify branch exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ steps.request.outputs.ref }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh api "repos/$env:GH_REPO/branches/$([uri]::EscapeDataString($env:TARGET_REF))" --silent

      - name: Dispatch minifilter Driver Verifier VM lab
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ steps.request.outputs.ref }}
          VERIFIER_PHASE: ${{ steps.request.outputs.phase }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = @{
            ref = $env:TARGET_REF
            inputs = @{
              phase = $env:VERIFIER_PHASE
              root_base = 'C:\RansomGuard-VM-Verifier'
              stress_root_base = 'C:\RansomGuard-VM-Verifier-Stress'
              parallelism = '16'
            }
          } | ConvertTo-Json -Depth 4 -Compress

          $payload | gh api --method POST -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "repos/$env:GH_REPO/actions/workflows/minifilter-verifier-vm.yml/dispatches" --input -

      - name: Record verifier dispatch
        shell: pwsh
        env:
          TARGET_REF: ${{ steps.request.outputs.ref }}
          VERIFIER_PHASE: ${{ steps.request.outputs.phase }}
        run: |
          Write-Host "Dispatched minifilter-verifier-vm.yml phase '$env:VERIFIER_PHASE' for ref '$env:TARGET_REF'."

  dispatch-verifier-reboot:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 59 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/reboot-verifier-vm ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout policy source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24 pinned
        with:
          ref: main

      - name: Verify threat-model policy
        shell: pwsh
        run: |
          .\tools\verify_threat_model.ps1

      - name: Parse and validate reboot request
        id: request
        shell: pwsh
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          $ErrorActionPreference = 'Stop'
          $body = [string]$env:COMMENT_BODY
          if ($body -notmatch '^/reboot-verifier-vm\s+(armed|runtime-reset)\s+([0-9a-fA-F]{40})\s*$') {
            throw 'Expected exactly: /reboot-verifier-vm <armed|runtime-reset> <40-char-sha>'
          }

          "phase=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha=$($Matches[2].ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Dispatch verifier reboot handoff
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PHASE: ${{ steps.request.outputs.phase }}
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = @{
            ref = 'main'
            inputs = @{
              expected_phase = $env:EXPECTED_PHASE
              expected_sha = $env:EXPECTED_SHA
            }
          } | ConvertTo-Json -Depth 4 -Compress

          $payload | gh api --method POST -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "repos/$env:GH_REPO/actions/workflows/verifier-reboot-vm.yml/dispatches" --input -

      - name: Record verifier reboot dispatch
        shell: pwsh
        env:
          EXPECTED_PHASE: ${{ steps.request.outputs.phase }}
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
        run: |
          Write-Host "Dispatched verifier reboot handoff for phase '$env:EXPECTED_PHASE' and SHA '$env:EXPECTED_SHA'."

  cancel-verifier-run:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 59 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/cancel-verifier-run ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout policy source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24 pinned
        with:
          ref: main

      - name: Verify threat-model policy
        shell: pwsh
        run: |
          .\tools\verify_threat_model.ps1

      - name: Parse verifier run id
        id: request
        shell: pwsh
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          $ErrorActionPreference='Stop'
          $body=[string]$env:COMMENT_BODY
          if($body -notmatch '^/cancel-verifier-run\s+([0-9]+)\s*$'){
            throw 'Expected exactly: /cancel-verifier-run <run-id>'
          }
          "run_id=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Validate target verifier run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_RUN_ID: ${{ steps.request.outputs.run_id }}
        run: |
          $ErrorActionPreference='Stop'
          $runJson=gh api "repos/$env:GH_REPO/actions/runs/$env:TARGET_RUN_ID"
          if($LASTEXITCODE -ne 0){throw "Unable to inspect Actions run $env:TARGET_RUN_ID."}
          $run=$runJson | ConvertFrom-Json
          $allowed=@(
            'Minifilter Driver Verifier VM lab',
            'RansomGuard Driver Verifier CLEAR recovery'
          )
          if([string]$run.name -notin $allowed){
            throw "Run $env:TARGET_RUN_ID is not an allowed Driver Verifier workflow."
          }
          if([string]::Equals([string]$run.status,'completed',[StringComparison]::OrdinalIgnoreCase)){
            throw "Run $env:TARGET_RUN_ID is already completed and must not be cancelled."
          }
          if(-not [string]::Equals([string]$run.repository.full_name,$env:GH_REPO,[StringComparison]::OrdinalIgnoreCase)){
            throw "Run $env:TARGET_RUN_ID does not belong to $env:GH_REPO."
          }
          Write-Host "Validated stale Driver Verifier run $env:TARGET_RUN_ID for cancellation."

      - name: Force-cancel stale verifier run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_RUN_ID: ${{ steps.request.outputs.run_id }}
        run: |
          $ErrorActionPreference='Stop'
          gh api --method POST "repos/$env:GH_REPO/actions/runs/$env:TARGET_RUN_ID/force-cancel" --silent
          if($LASTEXITCODE -ne 0){throw "Unable to force-cancel Driver Verifier run $env:TARGET_RUN_ID."}
          Write-Host "Force-cancelled stale Driver Verifier run $env:TARGET_RUN_ID."

  dispatch-verifier-clear-recovery:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 59 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/run-verifier-clear-recovery ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout policy source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24 pinned
        with:
          ref: main

      - name: Verify threat-model policy
        shell: pwsh
        run: |
          .\tools\verify_threat_model.ps1

      - name: Parse recovery request
        id: request
        shell: pwsh
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          $ErrorActionPreference='Stop'
          $body=[string]$env:COMMENT_BODY
          if($body -notmatch '^/run-verifier-clear-recovery\s+([0-9a-fA-F]{40})\s*$'){
            throw 'Expected exactly: /run-verifier-clear-recovery <40-char-sha>'
          }
          "sha=$($Matches[1].ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify commit exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ steps.request.outputs.sha }}
        run: |
          $ErrorActionPreference='Stop'
          gh api "repos/$env:GH_REPO/commits/$env:TARGET_SHA" --silent
          if($LASTEXITCODE -ne 0){throw "Commit $env:TARGET_SHA was not found in $env:GH_REPO."}

      - name: Dispatch verifier CLEAR recovery
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ steps.request.outputs.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $payload=@{
            ref='main'
            inputs=@{expected_sha=$env:TARGET_SHA}
          } | ConvertTo-Json -Depth 4 -Compress
          $payload | gh api --method POST -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "repos/$env:GH_REPO/actions/workflows/verifier-clear-recovery-vm.yml/dispatches" --input -

      - name: Record CLEAR recovery dispatch
        shell: pwsh
        env:
          TARGET_SHA: ${{ steps.request.outputs.sha }}
        run: |
          Write-Host "Dispatched exact-SHA verifier CLEAR recovery for '$env:TARGET_SHA'."

  dispatch-frozen-candidate-provenance:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 59 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/run-frozen-candidate-provenance ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout policy source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24 pinned
        with:
          ref: main

      - name: Verify threat-model policy
        shell: pwsh
        run: |
          .\tools\verify_threat_model.ps1

      - name: Parse provenance request
        id: request
        shell: pwsh
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          $ErrorActionPreference='Stop'
          $body=[string]$env:COMMENT_BODY
          if($body -notmatch '^/run-frozen-candidate-provenance\s+([0-9a-fA-F]{40})\s*$'){
            throw 'Expected exactly: /run-frozen-candidate-provenance <40-char-sha>'
          }
          "sha=$($Matches[1].ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify commit exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ steps.request.outputs.sha }}
        run: |
          $ErrorActionPreference='Stop'
          gh api "repos/$env:GH_REPO/commits/$env:TARGET_SHA" --silent
          if($LASTEXITCODE -ne 0){throw "Commit $env:TARGET_SHA was not found in $env:GH_REPO."}

      - name: Dispatch frozen candidate provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ steps.request.outputs.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $payload=@{
            ref='main'
            inputs=@{expected_sha=$env:TARGET_SHA}
          } | ConvertTo-Json -Depth 4 -Compress
          $payload | gh api --method POST -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "repos/$env:GH_REPO/actions/workflows/frozen-candidate-provenance-vm.yml/dispatches" --input -

      - name: Record provenance dispatch
        shell: pwsh
        env:
          TARGET_SHA: ${{ steps.request.outputs.sha }}
        run: |
          Write-Host "Dispatched frozen-candidate package provenance for '$env:TARGET_SHA'."

  dispatch-frozen-production-mutation:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 59 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/run-frozen-boundary-proof ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout policy source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24 pinned
        with:
          ref: main

      - name: Verify threat-model policy
        shell: pwsh
        run: |
          .\tools\verify_threat_model.ps1

      - name: Parse frozen boundary proof request
        id: request
        shell: pwsh
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          $ErrorActionPreference='Stop'
          $body=[string]$env:COMMENT_BODY
          if($body -notmatch '^/run-frozen-boundary-proof\s+([0-9a-fA-F]{40})\s+([0-9]+)\s*$'){
            throw 'Expected exactly: /run-frozen-boundary-proof <40-char-sha> <package-artifact-id>'
          }
          "sha=$($Matches[1].ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact_id=$($Matches[2])" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Validate frozen source and package artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ steps.request.outputs.sha }}
          PACKAGE_ARTIFACT_ID: ${{ steps.request.outputs.artifact_id }}
        run: |
          $ErrorActionPreference='Stop'
          gh api "repos/$env:GH_REPO/commits/$env:TARGET_SHA" --silent
          if($LASTEXITCODE -ne 0){throw "Commit $env:TARGET_SHA was not found."}
          $meta=gh api "repos/$env:GH_REPO/actions/artifacts/$env:PACKAGE_ARTIFACT_ID" | ConvertFrom-Json
          $expected="ransomguard-frozen-candidate-package-$env:TARGET_SHA"
          if([bool]$meta.expired){throw "Package artifact $env:PACKAGE_ARTIFACT_ID is expired."}
          if(-not [string]::Equals([string]$meta.name,$expected,[StringComparison]::Ordinal)){
            throw "Package artifact '$($meta.name)' does not match '$expected'."
          }

      - name: Dispatch frozen ProductionGate mutation matrix
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ steps.request.outputs.sha }}
          PACKAGE_ARTIFACT_ID: ${{ steps.request.outputs.artifact_id }}
        run: |
          $ErrorActionPreference='Stop'
          $payload=@{
            ref='main'
            inputs=@{
              expected_sha=$env:TARGET_SHA
              package_artifact_id=$env:PACKAGE_ARTIFACT_ID
              root_base='C:\RansomGuard-VM-ProductionMutation'
            }
          } | ConvertTo-Json -Depth 4 -Compress
          $payload | gh api --method POST -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "repos/$env:GH_REPO/actions/workflows/frozen-production-mutation-vm.yml/dispatches" --input -

      - name: Record production mutation dispatch
        shell: pwsh
        env:
          TARGET_SHA: ${{ steps.request.outputs.sha }}
          PACKAGE_ARTIFACT_ID: ${{ steps.request.outputs.artifact_id }}
        run: |
          Write-Host "Dispatched frozen ProductionGate mutation qualification for '$env:TARGET_SHA' using artifact '$env:PACKAGE_ARTIFACT_ID'."

  dispatch-frozen-immutable-runtime:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 59 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/run-frozen-runtime ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout policy source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24 pinned
        with:
          ref: main

      - name: Verify threat-model policy
        shell: pwsh
        run: |
          .\tools\verify_threat_model.ps1

      - name: Parse frozen runtime request
        id: request
        shell: pwsh
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          $ErrorActionPreference='Stop'
          $body=[string]$env:COMMENT_BODY
          if($body -notmatch '^/run-frozen-runtime\s+([0-9a-fA-F]{40})\s+([0-9]+)\s*$'){
            throw 'Expected exactly: /run-frozen-runtime <40-char-sha> <package-artifact-id>'
          }
          "sha=$($Matches[1].ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact_id=$($Matches[2])" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Validate frozen source and package artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ steps.request.outputs.sha }}
          PACKAGE_ARTIFACT_ID: ${{ steps.request.outputs.artifact_id }}
        run: |
          $ErrorActionPreference='Stop'
          gh api "repos/$env:GH_REPO/commits/$env:TARGET_SHA" --silent
          if($LASTEXITCODE -ne 0){throw "Commit $env:TARGET_SHA was not found."}
          $meta=gh api "repos/$env:GH_REPO/actions/artifacts/$env:PACKAGE_ARTIFACT_ID" | ConvertFrom-Json
          $expected="ransomguard-frozen-candidate-package-$env:TARGET_SHA"
          if([bool]$meta.expired){throw "Package artifact $env:PACKAGE_ARTIFACT_ID is expired."}
          if(-not [string]::Equals([string]$meta.name,$expected,[StringComparison]::Ordinal)){
            throw "Package artifact '$($meta.name)' does not match '$expected'."
          }

      - name: Dispatch immutable-package runtime suite
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ steps.request.outputs.sha }}
          PACKAGE_ARTIFACT_ID: ${{ steps.request.outputs.artifact_id }}
        run: |
          $ErrorActionPreference='Stop'
          $payload=@{
            ref='main'
            inputs=@{
              expected_sha=$env:TARGET_SHA
              package_artifact_id=$env:PACKAGE_ARTIFACT_ID
              root_base='C:\RansomGuard-VM-FrozenRuntime'
            }
          } | ConvertTo-Json -Depth 4 -Compress
          $payload | gh api --method POST -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "repos/$env:GH_REPO/actions/workflows/frozen-artifact-runtime-vm.yml/dispatches" --input -

  dispatch-frozen-immutable-verifier:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 59 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/run-frozen-verifier-vm ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout policy source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24 pinned
        with:
          ref: main

      - name: Verify threat-model policy
        shell: pwsh
        run: |
          .\tools\verify_threat_model.ps1

      - name: Parse frozen verifier request
        id: request
        shell: pwsh
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          $ErrorActionPreference='Stop'
          $body=[string]$env:COMMENT_BODY
          if($body -notmatch '^/run-frozen-verifier-vm\s+(arm|runtime|clear)\s+([0-9a-fA-F]{40})\s+([0-9]+)\s*$'){
            throw 'Expected exactly: /run-frozen-verifier-vm <arm|runtime|clear> <40-char-sha> <package-artifact-id>'
          }
          "phase=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha=$($Matches[2].ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact_id=$($Matches[3])" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Validate frozen source and package artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ steps.request.outputs.sha }}
          PACKAGE_ARTIFACT_ID: ${{ steps.request.outputs.artifact_id }}
        run: |
          $ErrorActionPreference='Stop'
          gh api "repos/$env:GH_REPO/commits/$env:TARGET_SHA" --silent
          if($LASTEXITCODE -ne 0){throw "Commit $env:TARGET_SHA was not found."}
          $meta=gh api "repos/$env:GH_REPO/actions/artifacts/$env:PACKAGE_ARTIFACT_ID" | ConvertFrom-Json
          $expected="ransomguard-frozen-candidate-package-$env:TARGET_SHA"
          if([bool]$meta.expired){throw "Package artifact $env:PACKAGE_ARTIFACT_ID is expired."}
          if(-not [string]::Equals([string]$meta.name,$expected,[StringComparison]::Ordinal)){
            throw "Package artifact '$($meta.name)' does not match '$expected'."
          }

      - name: Dispatch immutable-package Driver Verifier phase
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ steps.request.outputs.sha }}
          PACKAGE_ARTIFACT_ID: ${{ steps.request.outputs.artifact_id }}
          VERIFIER_PHASE: ${{ steps.request.outputs.phase }}
        run: |
          $ErrorActionPreference='Stop'
          $payload=@{
            ref='main'
            inputs=@{
              phase=$env:VERIFIER_PHASE
              expected_sha=$env:TARGET_SHA
              package_artifact_id=$env:PACKAGE_ARTIFACT_ID
              root_base='C:\RansomGuard-VM-FrozenVerifier'
              stress_root_base='C:\RansomGuard-VM-FrozenVerifier-Stress'
              parallelism='16'
            }
          } | ConvertTo-Json -Depth 5 -Compress
          $payload | gh api --method POST -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "repos/$env:GH_REPO/actions/workflows/frozen-artifact-verifier-vm.yml/dispatches" --input -

  dispatch-frozen-verifier-reboot:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 59 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/reboot-frozen-verifier-vm ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout policy source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24 pinned
        with:
          ref: main

      - name: Verify threat-model policy
        shell: pwsh
        run: |
          .\tools\verify_threat_model.ps1

      - name: Parse frozen verifier reboot request
        id: request
        shell: pwsh
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          $ErrorActionPreference='Stop'
          $body=[string]$env:COMMENT_BODY
          if($body -notmatch '^/reboot-frozen-verifier-vm\s+(armed|runtime-reset)\s+([0-9a-fA-F]{40})\s+([0-9]+)\s*$'){
            throw 'Expected exactly: /reboot-frozen-verifier-vm <armed|runtime-reset> <40-char-sha> <package-artifact-id>'
          }
          "phase=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha=$($Matches[2].ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact_id=$($Matches[3])" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Dispatch frozen verifier reboot
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ steps.request.outputs.sha }}
          PACKAGE_ARTIFACT_ID: ${{ steps.request.outputs.artifact_id }}
          EXPECTED_PHASE: ${{ steps.request.outputs.phase }}
        run: |
          $ErrorActionPreference='Stop'
          $payload=@{
            ref='main'
            inputs=@{
              expected_phase=$env:EXPECTED_PHASE
              expected_sha=$env:TARGET_SHA
              package_artifact_id=$env:PACKAGE_ARTIFACT_ID
              root_base='C:\RansomGuard-VM-FrozenVerifier'
            }
          } | ConvertTo-Json -Depth 5 -Compress
          $payload | gh api --method POST -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "repos/$env:GH_REPO/actions/workflows/frozen-verifier-reboot-vm.yml/dispatches" --input -

  dispatch-frozen-release-governance:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 59 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/run-frozen-release-governance ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout policy source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24 pinned
        with:
          ref: main

      - name: Verify threat-model policy
        shell: pwsh
        run: |
          .\tools\verify_threat_model.ps1

      - name: Parse frozen release-governance request
        id: request
        shell: pwsh
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          $ErrorActionPreference='Stop'
          $body=[string]$env:COMMENT_BODY
          if($body -notmatch '^/run-frozen-release-governance\s+([0-9a-fA-F]{40})\s*$'){
            throw 'Expected exactly: /run-frozen-release-governance <40-char-sha>'
          }
          "sha=$($Matches[1].ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify commit exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ steps.request.outputs.sha }}
        run: |
          $ErrorActionPreference='Stop'
          gh api "repos/$env:GH_REPO/commits/$env:TARGET_SHA" --silent
          if($LASTEXITCODE -ne 0){throw "Commit $env:TARGET_SHA was not found in $env:GH_REPO."}

      - name: Dispatch frozen release governance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ steps.request.outputs.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $payload=@{
            ref='main'
            inputs=@{source_sha=$env:TARGET_SHA}
          } | ConvertTo-Json -Depth 4 -Compress
          $payload | gh api --method POST -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "repos/$env:GH_REPO/actions/workflows/frozen-release-governance.yml/dispatches" --input -

      - name: Record frozen release-governance dispatch
        shell: pwsh
        env:
          TARGET_SHA: ${{ steps.request.outputs.sha }}
        run: |
          Write-Host "Dispatched frozen release governance for '$env:TARGET_SHA'."

