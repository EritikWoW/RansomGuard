name: Windows build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and test normal + LAB userspace bundle
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\build_windows.ps1 -IncludeLab
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ransomguard-build-logs
          path: build-logs/**
          if-no-files-found: warn

      - name: Upload validated release ZIPs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ransomguard-windows
          path: release/*.zip
          if-no-files-found: error
