name: Windows build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows build
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 node24 pinned # v4 pinned

      - name: Audit PowerShell automation
        shell: pwsh
        run: |
          .\tools\verify_powershell_automation.ps1
          .\tools\verify_supply_chain.ps1
          .\tools\verify_threat_model.ps1
          .\tools\verify_mixed_stress_vm_harness.ps1
          .\tools\verify_fault_campaign_vm_harness.ps1
          .\tools\verify_driver_verifier_vm_harness.ps1
          .\tools\verify_production_containment_e2e_harness.ps1
          .\tools\verify_production_containment_recovery_harness.ps1
          .\tools\test_release_artifact_reconstruction.ps1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0 node24 pinned # v4 pinned
        with:
          dotnet-version: 10.0.401

      - name: Build and test normal + LAB userspace bundle
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\build_windows.ps1 -IncludeLab

      - name: Upload verified NuGet lock files
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 node24 pinned # v4 pinned
        with:
          name: ransomguard-nuget-locks
          path: |
            src/**/packages.lock.json
            tests/**/packages.lock.json
            qualification/**/packages.lock.json
            !**/bin/**
            !**/obj/**
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 node24 pinned # v4 pinned
        with:
          name: ransomguard-build-logs
          path: build-logs/**
          if-no-files-found: warn

      - name: Generate release artifact inventory and SPDX SBOM
        if: success()
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          .\tools\generate_release_governance.ps1 -SourceSha $env:SOURCE_SHA

      - name: Upload release governance evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 node24 pinned # v4 pinned
        with:
          name: ransomguard-release-governance
          path: build-logs/release-governance/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload validated release ZIPs
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 node24 pinned # v4 pinned
        with:
          name: ransomguard-windows
          path: release/*.zip
          if-no-files-found: error
