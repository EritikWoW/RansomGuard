name: Windows build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned

      - name: Audit PowerShell automation
        shell: pwsh
        run: |
          .\tools\verify_powershell_automation.ps1
          .\tools\verify_supply_chain.ps1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4 pinned
        with:
          dotnet-version: 10.0.401

      - name: Build and test normal + LAB userspace bundle
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\build_windows.ps1 -IncludeLab

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned
        with:
          name: ransomguard-build-logs
          path: build-logs/**
          if-no-files-found: warn

      - name: Upload validated release ZIPs
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned
        with:
          name: ransomguard-windows
          path: release/*.zip
          if-no-files-found: error
